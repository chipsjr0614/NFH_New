<style>
:root{
  --bg:#F2F5F5;--card:#FFF;--sunk:#EAEFEE;--line:#D3DCDB;--line2:#E4EAE9;
  --ink:#0E1516;--ink2:#4A5959;--ink3:#7C8C8C;--ink4:#A8B5B5;
  --ac:#0F5F62;--acs:#DEEDEC;--ace:#9AC3C1;--on:#FFF;
  --ae:#1F6FD6;--dx:#D63A4D;--dxb:#FCEAEC;--pe:#A8730A;--peb:#F9F1DF;--ok:#15803D;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0B1011;--card:#151C1D;--sunk:#101718;--line:#2A3637;--line2:#222D2E;
  --ink:#E6ECEB;--ink2:#A2B0B0;--ink3:#78888;--ink4:#5B6B6B;
  --ac:#4FB3AE;--acs:#142D2C;--ace:#2D5553;--on:#07201F;
  --ae:#78ADEA;--dx:#F2808F;--dxb:#2D191D;--pe:#DCA940;--peb:#2A2312;--ok:#5EBE7F;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
/* ── 아이폰 고무줄(바운스) 스크롤 막기 (260805) ──
   빈 공간을 치거나 끝까지 넘기면 화면이 통째로 흔들리는 걸 막는다.
   사파리·Documents·홈화면 앱 모두에서 동일하게 적용된다. */
html{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  height:100%;overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;              /* 더블탭 확대로 인한 흔들림 방지 */
  display:flex;flex-direction:column}
/* 스크롤은 이 안에서만 일어난다 — 페이지 전체가 움직이지 않는다 */
#scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}

/* 상단 고정 */
.top{flex:none;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:flex;gap:8px;align-items:center}
.top input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--sunk);border-radius:9px;
  padding:10px 11px;font-size:15px;color:var(--ink);outline:none}
.top input:focus{border-color:var(--ac)}
.top input.id{max-width:120px;font-family:ui-monospace,Menlo,monospace}
.cp{background:var(--ac);color:var(--on);border-radius:10px;padding:11px 15px;font-size:15px;
  font-weight:800;white-space:nowrap;flex:none}
.cp.done{background:var(--ok)}
.hm{border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 11px;
  font-size:17px;flex:none;line-height:1}
.who{flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{font-family:ui-monospace,Menlo,monospace;font-weight:600;color:var(--ink3);margin-left:6px}
.gate{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;
  justify-content:center;padding:20px}
.gate.hide{display:none}
.gbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;
  width:100%;max-width:420px;box-shadow:0 12px 34px -20px rgba(0,0,0,.4)}
.gbox h1{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.gbox .gs{font-size:14px;color:var(--ink3);margin:0 0 18px}
.gin{display:block;width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:11px;
  padding:14px 15px;font-size:16px;color:var(--ink);margin-bottom:10px;outline:none}
.gin:focus{border-color:var(--ac)}
.gin.ok{border-color:var(--ok);background:var(--okb,transparent)}
.ggo{display:block;width:100%;text-align:center;border-radius:12px;padding:15px;font-size:16.5px;
  font-weight:800;background:var(--sunk);color:var(--ink4);border:1.5px solid var(--line);margin-top:4px}
.ggo.on{background:var(--ac);color:var(--on);border-color:var(--ac)}

.w{max-width:640px;margin:0 auto;padding:14px 12px}
.sec{margin-bottom:16px}
.lb{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--ink3);margin:0 0 8px;
  display:flex;align-items:center;gap:8px}
.lb::after{content:"";flex:1;height:1px;background:var(--line2)}
.row{display:flex;gap:7px;flex-wrap:wrap}
.b{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 13px;
  font-size:14.5px;font-weight:700;color:var(--ink2);min-height:46px;display:inline-flex;align-items:center}
.b.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.b.wide{flex:1;min-width:132px;justify-content:center}
.b.gh{border-style:dashed;color:var(--ac)}
/* 분기 선택지 — 문장이 길어 가로로 잘리므로 한 줄에 하나씩 */
.col{display:flex;flex-direction:column;gap:8px}
.bv{width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:11px;
  padding:15px 16px;font-size:16px;font-weight:700;color:var(--ink);min-height:56px;line-height:1.4}
.bv.on{background:var(--sunk);border-color:var(--ink)}

/* 질문 */
.q{background:var(--card);border:1.5px solid var(--line2);border-radius:12px;padding:14px 14px;
  margin-bottom:9px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q .t{flex:1;min-width:160px;font-size:17px;font-weight:700;letter-spacing:-.015em;line-height:1.45}
.q.miss{border-style:dashed;border-color:var(--ink4)}
.q.miss .t{color:var(--ink4)}
.yn{display:flex;gap:5px;flex:none}
.yn button{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink3);border-radius:9px;
  padding:11px 17px;font-size:15px;font-weight:700;min-height:46px}
.yn button.y{background:var(--ink);border-color:var(--ink);color:var(--card)}
.yn button.n{background:var(--sunk);border-color:var(--ink3);color:var(--ink)}
.tin{border:1.5px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;
  font-size:14px;color:var(--ink);width:84px;outline:none}

/* 자동 영역 */
.auto{background:var(--sunk);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:6px}
.auto .hd{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink3);margin-bottom:10px}
.dxc{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--dx);
  border-radius:10px;padding:11px 13px;margin-bottom:8px}
.dxc.off{opacity:.42}
.dxc .h{display:flex;align-items:center;gap:9px}
.dxc .nm{font-size:16px;font-weight:800;color:var(--dx);flex:1}
.dxc .tg{font-size:11px;font-weight:800;border:1px solid currentColor;border-radius:5px;padding:2px 7px;
  color:var(--dx);background:var(--dxb);flex:none}
.dxc .sw{font-size:12px;font-weight:800;color:var(--ink3);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;flex:none}
.pe{margin-top:8px}
.pe div{font-size:14px;color:var(--pe);padding:5px 0 0 2px}
.pe div span{color:var(--ink3);font-size:12px;display:block;margin-top:1px}
.none{font-size:14px;color:var(--ink4);padding:6px 2px}

/* 기록 */
.rec{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:16px}
.rec summary.h{padding:13px;background:var(--sunk);font-size:13px;font-weight:800;
  color:var(--ink2);display:flex;cursor:pointer;list-style:none;align-items:center}
.rec summary.h::-webkit-details-marker{display:none}
.rec[open] summary.h{border-bottom:1px solid var(--line)}
.rec .h span{margin-left:auto;font-family:ui-monospace,Menlo,monospace}
.rec pre{margin:0;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;
  font-size:12.5px;line-height:1.75;white-space:pre-wrap;color:var(--ink2);overflow-x:auto}
.hint{font-size:13px;color:var(--ink3);margin-top:9px;padding:0 2px}
details summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ac);
  padding:9px 0}
.cp.lockd{background:var(--sunk);color:var(--ink4);border:1.5px solid var(--line)}
.say{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-left:4px solid var(--pe);
  background:var(--card);border-radius:12px;padding:14px 15px;margin-bottom:12px}
.say.on{background:var(--peb);border-color:var(--pe)}
.say .s{font-size:16px;font-weight:700;line-height:1.5;letter-spacing:-.01em}
.say .r{font-size:12.5px;color:var(--pe);margin-top:7px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb2{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink3);margin:0 0 6px}
.vwrap{width:100%;margin-top:4px}
.vrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.vrow b{font-size:12px;color:var(--ink3);min-width:30px}
.vb{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink2);border-radius:8px;
  padding:9px 12px;font-size:14px;font-weight:700;min-height:44px;font-family:ui-monospace,Menlo,monospace}
.vb.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.b.gh2{border-style:dashed;color:var(--ac)}
.pref{margin-bottom:8px;border:1px solid var(--line);border-radius:9px}
.pref summary{padding:9px 11px;font-size:12.5px}
.prefb{padding:0 11px 11px}
.pwarn{background:var(--warnb);border:1px solid var(--warn);border-radius:8px;padding:8px 10px;
  font-size:12px;margin-bottom:9px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(66px,1fr));gap:7px}
.pc{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:7px 4px;text-align:center}
.pc .pn{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;font-weight:800;margin-top:4px}
.pc .pt{font-size:10px;color:var(--ink3)}
.gh{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--ac);margin:14px 0 7px}
.gh .gk{background:var(--acs);border:1px solid var(--ace);border-radius:5px;padding:1px 6px;
  font-family:ui-monospace,Menlo,monospace;font-size:11px}
.gh::after{content:"";flex:1;height:1px;background:var(--ace)}
.ob{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;min-height:48px}
.ob.on{border-color:var(--ink);background:var(--sunk)}
.ob .on2{width:30px;height:30px;border-radius:8px;background:var(--sunk);border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px;flex:none;
  font-family:ui-monospace,Menlo,monospace}
.ob.on .on2{background:var(--ink);border-color:var(--ink);color:var(--card)}
.ob .ot{flex:1;min-width:0;font-size:14.5px;font-weight:700;line-height:1.35}
.ob .of{flex:none;width:36px;display:flex;align-items:center;justify-content:center}
.oex{background:var(--sunk);border:1px solid var(--ace);border-radius:9px;padding:9px 11px;
  margin:-2px 0 8px;font-size:12.5px;color:var(--ink2);line-height:1.55;display:flex;gap:10px;align-items:center}
.oex .ofb{flex:none}
.gsum{background:var(--sunk);border:1.5px solid var(--ac);border-radius:11px;padding:11px 13px;
  display:flex;align-items:center;gap:14px;margin-top:9px;flex-wrap:wrap}
.gsum .gl2{font-size:11px;color:var(--ink3)}
.gsum .gv{font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:800;color:var(--ac)}
.gsum .gevm{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:800}
.gsum .gst{margin-left:auto;font-size:11.5px;font-weight:800;border-radius:7px;padding:5px 10px;
  border:1.5px solid currentColor}
.gst.g{color:var(--ok)} .gst.y{color:var(--warn)} .gst.r{color:var(--dx)}
.lock{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;
  background:var(--sunk);border:1.5px dashed var(--ink4);color:var(--ink2)}
.lock.ok{border-style:solid;border-color:var(--ok);color:var(--ok);background:transparent;font-weight:700}
.lock .ls{margin-top:8px;font-size:13px;color:var(--ink3);line-height:1.7}
details summary::-webkit-details-marker{display:none}
</style></head><body>

<div class="gate" id="gate"><div class="gbox">
  <h1>🛡️ 시작 전 — 환자 확인</h1>
  <p class="gs">이름과 등록번호를 넣어주세요.</p>
  <input id="nm" class="gin" placeholder="환자 이름" autocomplete="off">
  <input id="id" class="gin" placeholder="등록번호 (숫자 8자리)" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="ggo" id="ggo">시작</button>
</div></div>

<div class="top">
  <button class="hm" id="hm" title="새 환자">🏠</button>
  <span class="who" id="who"></span>
  <button class="cp" id="cp">📤 복사</button>
</div>

<div id="scroll"><div class="w" id="w"></div></div>

<script>
/*__DATA__*/
const D=window.NFH_V6, $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='nfh_v7';
const ORI=[['person','사람','"제가 누구인지, 옆에 계신 분이 누구인지 아시겠어요?"'],
           ['time','시간','"오늘이 며칠인지, 지금이 낮인지 밤인지 아시겠어요?"'],
           ['place','장소','"여기가 어디인지 아시겠어요?"']];
const ORINM={person:'사람',time:'시간',place:'장소'};
const GCS={
 E:[[4,'자발적으로 눈뜸','다가가지 않아도 스스로 눈을 뜨고 있음',''],
    [3,'부르면 눈뜸','이름을 부르거나 말을 걸면 눈을 뜸',''],
    [2,'통증에 눈뜸','손톱 밑·눈썹 위를 눌러야 눈을 뜸',''],
    [1,'눈뜨지 않음','어떤 자극에도 눈을 뜨지 않음','']],
 V:[[5,'지남력 있음','이름·장소·날짜를 정확히 말함',''],
    [4,'혼돈','말은 하지만 앞뒤가 안 맞음',''],
    [3,'부적절한 단어','단어는 나오지만 문장이 안 됨 (“물… 아파…”)',''],
    [2,'이해불가 소리','신음·웅얼거림만 냄',''],
    [1,'소리 없음','아무 소리도 내지 않음','']],
 M:[[6,'명령을 따름','“손을 들어보세요” 하면 그대로 함','obey'],
    [5,'통증 부위로 손을 가져감','아픈 곳을 찾아 손이 올라옴 · 국소화','local'],
    [4,'통증에서 피함','자극을 주면 팔을 빼지만 부위는 못 찾음','with'],
    [3,'이상 굴곡','팔을 <b>가슴 쪽으로 굽힘</b> · 제피질 자세. 신전과 헷갈리면 팔이 <b>안으로 접히는지</b>를 보세요','flex'],
    [2,'이상 신전','팔을 <b>몸 옆으로 쭉 펴고 안쪽으로 돌림</b> · 제뇌 자세','ext'],
    [1,'움직임 없음','어떤 자극에도 움직이지 않음','none']]};
const GCSNM={E:'눈뜸',V:'언어',M:'운동'};
function fig(kind,w){
  w=w||36; const S2='stroke="var(--ink3)" stroke-width="2.6" fill="none" stroke-linecap="round"';
  let a='';
  if(kind==='flex')       a='<path d="M28 26 L32 31 L38 28" '+S2+'/><path d="M48 26 L44 31 L38 28" '+S2+'/>';
  else if(kind==='ext')   a='<line x1="38" y1="25" x2="21" y2="34" '+S2+'/><line x1="38" y1="25" x2="55" y2="34" '+S2+'/>';
  else if(kind==='local') a='<path d="M26 30 Q30 20 38 17" '+S2+'/><line x1="38" y1="25" x2="50" y2="33" '+S2+'/><circle cx="38" cy="15" r="2.8" fill="var(--dx)"/>';
  else if(kind==='with')  a='<line x1="38" y1="25" x2="26" y2="17" '+S2+'/><line x1="38" y1="25" x2="50" y2="33" '+S2+'/><circle cx="21" cy="15" r="2.8" fill="var(--dx)"/>';
  else if(kind==='obey')  a='<line x1="38" y1="25" x2="26" y2="11" '+S2+'/><line x1="38" y1="25" x2="50" y2="11" '+S2+'/>';
  else                    a='<line x1="38" y1="27" x2="24" y2="30" '+S2+' opacity=".4"/><line x1="38" y1="27" x2="52" y2="30" '+S2+' opacity=".4"/>';
  return `<svg width="${w}" height="${Math.round(w*0.78)}" viewBox="0 0 76 58" aria-hidden="true">
    <circle cx="38" cy="12" r="6.5" fill="var(--ink4)"/><line x1="38" y1="19" x2="38" y2="38" ${S2}/>${a}
    <line x1="38" y1="38" x2="30" y2="52" ${S2}/><line x1="38" y1="38" x2="46" y2="52" ${S2}/></svg>`;
}
const gcsSum=()=> (S.gcs.E&&S.gcs.V&&S.gcs.M)? S.gcs.E+S.gcs.V+S.gcs.M : null;
let S={nm:'',id:'',edu:false,consc:null,guard:null,ori:{},gcs:{E:null,V:null,M:null},
       sym:'',s1:'',s2:'',set:'',ans:{},off:[],cath:{},memo:''};

try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ── 헬퍼 ── */
const setOf=k=>D.sets[k];
const brOf=s=>D.branch.filter(b=>b.sym===s);
function stmt(qid,v){
  const q=D.qbank[qid]; if(!q||v===undefined||v===null) return null;
  if(q.fmt==='값입력'){
    if(typeof v==='object'&&v){
      if(v.rt||v.lt)   return q.stmts[0]+' Rt '+(v.rt||'__')+' / Lt '+(v.lt||'__');
      if(v.sbp||v.dbp) return q.stmts[0]+' '+(v.sbp||'__')+' / '+(v.dbp||'__');
      return null;
    }
    return String(v).trim()? q.stmts[0]+' '+String(v).trim():null;
  }
  if(q.fmt==='선택')  return q.stmts[v]||null;
  return v===true? (q.stmts[0]||null) : (v===false? (q.stmts[1]||null) : null);
}
const pos=(q)=>S.ans[q]===true||(D.qbank[q]&&D.qbank[q].fmt!=='토글'&&S.ans[q]!==undefined&&S.ans[q]!==false);
function rec(dx){          /* 그 진단만의 고유 사정으로 추천 판정 */
  const st=setOf(S.set); if(!st) return false;
  const others=st.dx.filter(d=>d.name!==dx.name);
  const own=dx.ae.filter(q=>!others.some(o=>o.ae.includes(q)));
  return (own.length?own:dx.ae).some(pos);
}
const on=n=>!S.off.includes(n);
function peOf(dx){         /* 평가 2개 — 📢 문구 있는 것 우선 */
  const ex=(D.explain[dx.name]||[]).map(e=>({pe:e.pe,say:e.say}));
  const rest=dx.pe.filter(p=>!ex.some(e=>e.pe===p)).map(p=>({pe:p,say:''}));
  return ex.concat(rest).slice(0,2);
}
const shortLab=ss=>{
  if(ss.length<2) return ss.slice();
  let p=0; while(p<ss[0].length&&ss.every(x=>x[p]===ss[0][p])) p++;
  let q=0; while(q<ss[0].length-p&&ss.every(x=>x[x.length-1-q]===ss[0][ss[0].length-1-q])) q++;
  const c=ss.map(x=>x.slice(p,x.length-q).trim());
  return c.every(Boolean)?c:ss;
};

/* ── 기록 만들기 ── */
function blocks(){
  const out=[];
  const cs=Object.keys(S.cath).filter(k=>(S.cath[k]||[]).length);
  if(cs.length) out.push({t:'도관', ae:cs.flatMap(k=>S.cath[k]), dx:'', pe:[]});
  const st=setOf(S.set);
  /* 같은 사정이 여러 진단에 걸려 있으면 앞 블록에만 넣는다.
     안 그러면 dizziness·기침이 진단마다 반복돼 읽기 어렵다 */
  const used=new Set();
  if(st) st.dx.forEach(dx=>{
    if(!on(dx.name)) return;
    const ae=dx.ae.map(q=>stmt(q,S.ans[q])).filter(Boolean).filter(x=>!used.has(x));
    ae.forEach(x=>used.add(x));
    const pe=peOf(dx).map(x=>x.pe);
    if(ae.length||pe.length) out.push({t:dx.name, ae, dx:dx.name, pe});
  });
  /* 맞이교육 + 의식 + 보호자 → 낙상위험. 항상 기록 맨 끝에 온다 */
  if(S.edu || S.consc || S.guard){
    const ae=[];
    const g=gcsSum();
    /* 점수가 곧 근거다. 15점 미만을 눌렀어도 합계가 15면 「명료함」으로 적는다 */
    if(S.consc==='의식 명료함'){ ae.push('Glasgow Coma Scale : 15','의식 명료함'); }
    else if(S.consc==='의식수준 저하됨'){
      if(g!==null) ae.push('Glasgow Coma Scale : '+g);
      ae.push(g===15 ? '의식 명료함' : '의식수준 저하됨');
    }
    ORI.forEach(([k])=>{ if(S.ori[k]!==undefined)
      ae.push(`${ORINM[k]}에 대한 지남력 ${S.ori[k]===1?'있음':'없음'}`); });
    if(S.guard) ae.push(S.guard);
    out.push({t:'의식 · 낙상', ae,
      dx:'낙상위험',
      pe:['낙상방지 교육함','침대 난간을 올려줌','도난방지 교육함']});
  }
  return out;
}
function text(){
  const L=[];
  const who=[S.nm.trim(),S.id.trim()].filter(Boolean).join(' ');
  if(who) L.push('['+who+']','');
  blocks().forEach(b=>{
    L.push('■ '+b.t);
    if(b.ae.length) L.push('사정) '+b.ae.join(', '));
    if(b.dx)        L.push('진단) '+b.dx);
    if(b.pe.length) L.push('평가) '+b.pe.join(', '));
    L.push('');
  });
  if(S.memo.trim()) L.push('('+S.memo.trim()+')');
  return L.join('\n').trim();
}

/* 직접 입력 대신 버튼 — 이름·등록번호 말고는 타이핑하지 않는다 */
const PUPIL=[1,2,3,4,5,6,7,8];
const PUPREF=[[1,'pinpoint'],[2,'수축'],[3,'정상'],[4,'정상'],[5,'정상'],[6,'확대'],[7,'확대'],[8,'고도 확대']];
const SBP=[80,90,100,110,120,130,140,150,160,180,200];
const DBP=[40,50,60,70,80,90,100,110];
const INR=['1.0','1.5','2.0','2.5','3.0','3.5','4.0 이상'];
const LOC=['alert','drowsy','stupor','semicoma','coma'];
function valBtns(q,v,a){
  const st=v.stmts[0]||'';
  const pick=(k,val,cur)=>`<button class="vb ${cur===String(val)?'on':''}" data-vb="${q}" data-k="${k}" data-v="${val}">${val}</button>`;
  if(st.indexOf('동공크기')===0){
    const o=(typeof a==='object'&&a)?a:{};
    return `<div class="vwrap">
      <details class="pref"><summary>👁️ 크기 참고표 <span class="cv">▾</span></summary>
        <div class="prefb"><div class="pwarn">⚠️ 화면 그림은 실제 크기가 아닙니다. 실물 동공자로 재세요.</div>
        <div class="pgrid">${PUPREF.map(([n,t])=>`<div class="pc">
          <svg width="54" height="34" viewBox="0 0 54 34"><ellipse cx="27" cy="17" rx="24" ry="13" fill="none" stroke="var(--ink3)" stroke-width="1.4"/>
          <circle cx="27" cy="17" r="10" fill="var(--ink4)" opacity=".45"/><circle cx="27" cy="17" r="${10*n/11}" fill="var(--ink)"/></svg>
          <div class="pn">${n}mm</div><div class="pt">${t}</div></div>`).join('')}</div></div></details>
      <div class="vrow"><b>Rt</b>${PUPIL.map(n=>pick('rt',n,String(o.rt||''))).join('')}</div>
      <div class="vrow"><b>Lt</b>${PUPIL.map(n=>pick('lt',n,String(o.lt||''))).join('')}</div></div>`;
  }
  if(st.indexOf('혈압')===0){
    const o=(typeof a==='object'&&a)?a:{};
    return `<div class="vwrap">
      <div class="vrow"><b>수축</b>${SBP.map(n=>pick('sbp',n,String(o.sbp||''))).join('')}</div>
      <div class="vrow"><b>이완</b>${DBP.map(n=>pick('dbp',n,String(o.dbp||''))).join('')}</div></div>`;
  }
  if(st.indexOf('INR')===0)
    return `<div class="vwrap"><div class="vrow">${INR.map(n=>pick('v',n,String(a||''))).join('')}</div></div>`;
  if(st.indexOf('의식수준')===0)
    return `<div class="vwrap"><div class="vrow">${LOC.map(n=>pick('v',n,String(a||''))).join('')}</div></div>`;
  return `<div class="vwrap"><div class="vrow">${['확인함'].map(n=>pick('v',n,String(a||''))).join('')}</div></div>`;
}
/* 아직 안 채운 것 — 하나라도 있으면 복사를 막는다 */
function missing(){
  const m=[];
  if(!S.edu)       m.push('맞이 안내');
  if(!S.consc)     m.push('의식');
  if(!S.guard)     m.push('보호자');
  if(S.consc==='의식수준 저하됨'){
    ['E','V','M'].forEach(k=>{ if(!S.gcs[k]) m.push('GCS '+k+' '+GCSNM[k]); });
    ORI.forEach(([k,lb])=>{ if(S.ori[k]===undefined) m.push('지남력 — '+lb); });
  }
  const st=setOf(S.set);
  if(!st) m.push('주호소 선택');
  else [...new Set(st.dx.flatMap(d=>d.ae))].forEach(q=>{
    if(S.ans[q]===undefined) m.push(D.qbank[q].q.replace(/^["“]|["”]$/g,'').slice(0,22));
  });
  return m;
}

/* ── 이벤트 ── */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-sym],[data-s1],[data-s2],[data-yn],[data-sel],[data-off],[data-edu],[data-cs],[data-gd],[data-or],[data-gc],[data-vb],[data-cmore],[data-ct],[data-cd],[data-reset]');
  if(!b) return; const d=b.dataset;
  if(d.reset){ S.sym=S.s1=S.s2=S.set=''; S.ans={}; S.off=[]; }
  else if(d.sym){ S.sym=d.sym; S.s1=S.s2=S.set=''; S.ans={}; }
  else if(d.s1){ S.s1=d.s1; S.s2=''; }
  else if(d.s2){ S.s2=d.s2; }
  else if(d.yn){ const v=d.v==='1'; S.ans[d.yn]=S.ans[d.yn]===v?undefined:v; }
  else if(d.sel){ const i=+d.i; S.ans[d.sel]=S.ans[d.sel]===i?undefined:i; }
  else if(d.off){ const i=S.off.indexOf(d.off); i<0?S.off.push(d.off):S.off.splice(i,1); }
  else if(d.edu){ S.edu=!S.edu; }
  else if(d.cs){ S.consc = S.consc===d.cs?null:d.cs;
    if(S.consc!=='의식수준 저하됨'){ S.gcs={E:null,V:null,M:null}; S.ori={}; } }
  else if(d.gd){ S.guard = S.guard===d.gd?null:d.gd; }
  else if(d.or){ const v=+d.v; S.ori[d.or] = S.ori[d.or]===v?undefined:v; }
  else if(d.gc){ const n=+d.n; S.gcs[d.gc] = S.gcs[d.gc]===n?null:n; }
  else if(d.vb){
    if(d.k==='v'){ S.ans[d.vb] = String(S.ans[d.vb])===d.v ? undefined : d.v; }
    else { const o=Object.assign({}, (typeof S.ans[d.vb]==='object'&&S.ans[d.vb])||{});
      o[d.k] = String(o[d.k])===d.v ? undefined : d.v;
      S.ans[d.vb] = (o.rt||o.lt||o.sbp||o.dbp) ? o : undefined; } }
  else if(d.cmore){ S.cathAll=true; }
  else if(d.ct){ S.cath[d.ct]?delete S.cath[d.ct]:S.cath[d.ct]=[]; }
  else if(d.cd){ const a=S.cath[d.cd]||(S.cath[d.cd]=[]); const i=a.indexOf(d.v); i<0?a.push(d.v):a.splice(i,1); }
  view();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nm'){S.nm=t.value;save();return;}
  if(t.id==='id'){S.id=t.value;save();return;}
  if(t.id==='memo'){S.memo=t.value;save();return;}
  if(t.dataset.in){S.ans[t.dataset.in]=t.value;save();}
});
$('cp').onclick=()=>{
  const m=missing();
  if(m.length){ alert('아직 '+m.length+'개 남았습니다.\n\n'+m.slice(0,8).join('\n')+(m.length>8?'\n…':'')); return; }
  const t=text();
  if(!t){alert('아직 기록이 없습니다.');return;}
  const done=()=>{const b=$('cp');b.textContent='✅ 복사됨';b.classList.add('done');
    setTimeout(()=>{b.textContent='📤 복사';b.classList.remove('done')},1600);};
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(()=>prompt('길게 눌러 복사:',t));
  else prompt('길게 눌러 복사:',t);
};
function gval(){
  const ok = $('nm').value.trim() && /^\d{8}$/.test($('id').value.trim());
  $('ggo').className='ggo'+(ok?' on':'');
  $('nm').classList.toggle('ok', !!$('nm').value.trim());
  $('id').classList.toggle('ok', /^\d{8}$/.test($('id').value.trim()));
  return ok;
}
['nm','id'].forEach(i=>$(i).addEventListener('input',gval));
$('ggo').onclick=()=>{
  if(!gval()) return;
  S.nm=$('nm').value.trim(); S.id=$('id').value.trim();
  $('gate').classList.add('hide'); view();
};
$('hm').onclick=()=>{
  if(!confirm('새 환자로 시작할까요?\n지금 기록은 지워집니다.')) return;
  S={nm:'',id:'',edu:false,consc:null,guard:null,ori:{},gcs:{E:null,V:null,M:null},sym:'',s1:'',s2:'',set:'',ans:{},off:[],cath:{},memo:''};
  try{localStorage.removeItem(KEY)}catch(e){}
  $('nm').value=''; $('id').value=''; $('scroll').scrollTop=0;
  $('gate').classList.remove('hide'); gval(); $('nm').focus(); view();
};
$('nm').value=S.nm; $('id').value=S.id; gval();
if(S.nm && S.id) $('gate').classList.add('hide');
view();
</script>
</body></html>

<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>간호기록 빠른기록</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="간호기록">
<meta name="theme-color" content="#0F5F62">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230F5F62'/%3E%3Ctext x='90' y='86' font-size='64' text-anchor='middle'%3E%F0%9F%A9%BA%3C/text%3E%3Ctext x='90' y='138' font-size='30' font-family='-apple-system,sans-serif' font-weight='800' fill='%23fff' text-anchor='middle'%3E%EA%B0%84%ED%98%B8%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#F2F5F5;--card:#FFF;--sunk:#EAEFEE;--line:#D3DCDB;--line2:#E4EAE9;
  --ink:#0E1516;--ink2:#4A5959;--ink3:#7C8C8C;--ink4:#A8B5B5;
  --ac:#0F5F62;--acs:#DEEDEC;--ace:#9AC3C1;--on:#FFF;
  --ae:#1F6FD6;--dx:#D63A4D;--dxb:#FCEAEC;--pe:#A8730A;--peb:#F9F1DF;--ok:#15803D;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0B1011;--card:#151C1D;--sunk:#101718;--line:#2A3637;--line2:#222D2E;
  --ink:#E6ECEB;--ink2:#A2B0B0;--ink3:#78888;--ink4:#5B6B6B;
  --ac:#4FB3AE;--acs:#142D2C;--ace:#2D5553;--on:#07201F;
  --ae:#78ADEA;--dx:#F2808F;--dxb:#2D191D;--pe:#DCA940;--peb:#2A2312;--ok:#5EBE7F;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}

/* 상단 고정 */
.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);
  padding:calc(9px + env(safe-area-inset-top)) 12px 9px;display:flex;gap:8px;align-items:center}
.top input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--sunk);border-radius:9px;
  padding:10px 11px;font-size:15px;color:var(--ink);outline:none}
.top input:focus{border-color:var(--ac)}
.top input.id{max-width:120px;font-family:ui-monospace,Menlo,monospace}
.cp{background:var(--ac);color:var(--on);border-radius:10px;padding:11px 15px;font-size:15px;
  font-weight:800;white-space:nowrap;flex:none}
.cp.done{background:var(--ok)}

.w{max-width:640px;margin:0 auto;padding:14px 12px}
.sec{margin-bottom:16px}
.lb{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--ink3);margin:0 0 8px;
  display:flex;align-items:center;gap:8px}
.lb::after{content:"";flex:1;height:1px;background:var(--line2)}
.row{display:flex;gap:7px;flex-wrap:wrap}
.b{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 13px;
  font-size:14.5px;font-weight:700;color:var(--ink2);min-height:46px;display:inline-flex;align-items:center}
.b.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.b.wide{flex:1;min-width:132px;justify-content:center}
.b.gh{border-style:dashed;color:var(--ac)}

/* 질문 */
.q{background:var(--card);border:1.5px solid var(--line2);border-radius:11px;padding:11px 12px;
  margin-bottom:7px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.q .t{flex:1;min-width:150px;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.q.miss{border-style:dashed;border-color:var(--ink4)}
.q.miss .t{color:var(--ink4)}
.yn{display:flex;gap:5px;flex:none}
.yn button{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink3);border-radius:8px;
  padding:9px 14px;font-size:14px;font-weight:700;min-height:42px}
.yn button.y{background:var(--ink);border-color:var(--ink);color:var(--card)}
.yn button.n{background:var(--sunk);border-color:var(--ink3);color:var(--ink)}
.tin{border:1.5px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px;
  font-size:14px;color:var(--ink);width:84px;outline:none}

/* 자동 영역 */
.auto{background:var(--sunk);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:6px}
.auto .hd{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink3);margin-bottom:10px}
.dxc{background:var(--card);border:1.5px solid var(--line);border-left:4px solid var(--dx);
  border-radius:10px;padding:11px 13px;margin-bottom:8px}
.dxc.off{opacity:.42}
.dxc .h{display:flex;align-items:center;gap:9px}
.dxc .nm{font-size:16px;font-weight:800;color:var(--dx);flex:1}
.dxc .tg{font-size:11px;font-weight:800;border:1px solid currentColor;border-radius:5px;padding:2px 7px;
  color:var(--dx);background:var(--dxb);flex:none}
.dxc .sw{font-size:12px;font-weight:800;color:var(--ink3);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;flex:none}
.pe{margin-top:8px}
.pe div{font-size:14px;color:var(--pe);padding:5px 0 0 2px}
.pe div span{color:var(--ink3);font-size:12px;display:block;margin-top:1px}
.none{font-size:14px;color:var(--ink4);padding:6px 2px}

/* 기록 */
.rec{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:16px}
.rec .h{padding:10px 13px;background:var(--sunk);border-bottom:1px solid var(--line);
  font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink3);display:flex}
.rec .h span{margin-left:auto;font-family:ui-monospace,Menlo,monospace}
.rec pre{margin:0;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;
  font-size:12.5px;line-height:1.75;white-space:pre-wrap;color:var(--ink2);overflow-x:auto}
.hint{font-size:13px;color:var(--ink3);margin-top:9px;padding:0 2px}
details summary{list-style:none;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ac);
  padding:9px 0}
details summary::-webkit-details-marker{display:none}
</style></head><body>

<div class="top">
  <input id="nm" placeholder="이름" autocomplete="off">
  <input id="id" class="id" placeholder="등록번호" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="cp" id="cp">📤 복사</button>
</div>

<div class="w" id="w"></div>

<script>
/*__DATA__*/
const D=window.NFH_V6, $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='nfh_quick';
let S={nm:'',id:'',sym:'',s1:'',s2:'',set:'',ans:{},off:[],fall:true,cath:{},memo:''};

try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ── 헬퍼 ── */
const setOf=k=>D.sets[k];
const brOf=s=>D.branch.filter(b=>b.sym===s);
function stmt(qid,v){
  const q=D.qbank[qid]; if(!q||v===undefined||v===null) return null;
  if(q.fmt==='값입력') return String(v).trim()? q.stmts[0]+' '+String(v).trim():null;
  if(q.fmt==='선택')  return q.stmts[v]||null;
  return v===true? (q.stmts[0]||null) : (v===false? (q.stmts[1]||null) : null);
}
const pos=(q)=>S.ans[q]===true||(D.qbank[q]&&D.qbank[q].fmt!=='토글'&&S.ans[q]!==undefined&&S.ans[q]!==false);
function rec(dx){          /* 그 진단만의 고유 사정으로 추천 판정 */
  const st=setOf(S.set); if(!st) return false;
  const others=st.dx.filter(d=>d.name!==dx.name);
  const own=dx.ae.filter(q=>!others.some(o=>o.ae.includes(q)));
  return (own.length?own:dx.ae).some(pos);
}
const on=n=>!S.off.includes(n);
function peOf(dx){         /* 평가 2개 — 📢 문구 있는 것 우선 */
  const ex=(D.explain[dx.name]||[]).map(e=>({pe:e.pe,say:e.say}));
  const rest=dx.pe.filter(p=>!ex.some(e=>e.pe===p)).map(p=>({pe:p,say:''}));
  return ex.concat(rest).slice(0,2);
}
const shortLab=ss=>{
  if(ss.length<2) return ss.slice();
  let p=0; while(p<ss[0].length&&ss.every(x=>x[p]===ss[0][p])) p++;
  let q=0; while(q<ss[0].length-p&&ss.every(x=>x[x.length-1-q]===ss[0][ss[0].length-1-q])) q++;
  const c=ss.map(x=>x.slice(p,x.length-q).trim());
  return c.every(Boolean)?c:ss;
};

/* ── 기록 만들기 ── */
function blocks(){
  const out=[];
  const cs=Object.keys(S.cath).filter(k=>(S.cath[k]||[]).length);
  if(cs.length) out.push({t:'도관', ae:cs.flatMap(k=>S.cath[k]), dx:'', pe:[]});
  const st=setOf(S.set);
  if(st) st.dx.forEach(dx=>{
    if(!on(dx.name)) return;
    const ae=dx.ae.map(q=>stmt(q,S.ans[q])).filter(Boolean);
    const pe=peOf(dx).map(x=>x.pe);
    if(ae.length||pe.length) out.push({t:dx.name, ae, dx:dx.name, pe});
  });
  if(S.fall) out.push({t:'낙상', ae:['의식 명료함'], dx:'낙상위험', pe:['낙상방지 교육함','침대 난간을 올려줌']});
  return out;
}
function text(){
  const L=[];
  const who=[S.nm.trim(),S.id.trim()].filter(Boolean).join(' ');
  if(who) L.push('['+who+']','');
  blocks().forEach(b=>{
    L.push('■ '+b.t);
    if(b.ae.length) L.push('사정) '+b.ae.join(', '));
    if(b.dx)        L.push('진단) '+b.dx);
    if(b.pe.length) L.push('평가) '+b.pe.join(', '));
    L.push('');
  });
  if(S.memo.trim()) L.push('비고) '+S.memo.trim());
  return L.join('\n').trim();
}

/* ── 화면 ── */
function view(){
  const st=setOf(S.set), h=[];

  /* 주호소 */
  if(!S.sym){
    h.push(`<div class="sec"><p class="lb">어디가 불편해서 오셨어요?</p><div class="row">`
      + Object.keys(D.syms).map(s=>`<button class="b" data-sym="${esc(s)}">${esc(D.syms[s].icon||'')} ${esc(s)}</button>`).join('')
      + `</div></div>`);
  } else if(!S.set){
    const bs=brOf(S.sym), y=D.syms[S.sym];
    if(!S.s1 && bs.some(b=>b.sel1)){
      h.push(`<div class="sec"><p class="lb">${esc(S.sym)}</p>
        <p style="font-size:17px;font-weight:800;margin:0 0 10px">💬 ${esc(y.q1||'선택하세요')}</p><div class="row">`
        + [...new Set(bs.map(b=>b.sel1).filter(Boolean))].map(v=>`<button class="b wide" data-s1="${esc(v)}">${esc(v)}</button>`).join('')
        + `</div><button class="b gh" data-reset="1" style="margin-top:10px">← 주호소 다시</button></div>`);
    } else {
      const c=bs.filter(b=>!S.s1||b.sel1===S.s1);
      if(!S.s2 && c.some(b=>b.sel2)){
        h.push(`<div class="sec"><p class="lb">${esc(S.sym)} › ${esc(S.s1)}</p>
          <p style="font-size:17px;font-weight:800;margin:0 0 10px">💬 ${esc(y.q2||'선택하세요')}</p><div class="row">`
          + [...new Set(c.map(b=>b.sel2).filter(Boolean))].map(v=>`<button class="b wide" data-s2="${esc(v)}">${esc(v)}</button>`).join('')
          + `</div><button class="b gh" data-reset="1" style="margin-top:10px">← 주호소 다시</button></div>`);
      } else {
        const hit=c.find(b=>!b.sel2||b.sel2===S.s2)||c[0];
        if(hit){ S.set=hit.set; return view(); }
      }
    }
  }

  /* 사정 */
  if(st){
    const path=[S.sym,S.s1,S.s2].filter(Boolean).join(' › ');
    h.push(`<div class="sec"><p class="lb">${esc(path)} <button class="b gh" data-reset="1" style="padding:4px 9px;min-height:0;font-size:12px">바꾸기</button></p>`);
    const qs=[...new Set(st.dx.flatMap(d=>d.ae))];
    qs.forEach(q=>{
      const v=D.qbank[q], a=S.ans[q], miss=a===undefined;
      let ans;
      if(v.fmt==='값입력') ans=`<input class="tin" data-in="${q}" value="${esc(a||'')}" placeholder="입력">`;
      else if(v.fmt==='선택'){ const lb=shortLab(v.stmts);
        ans=`<span class="yn">`+v.stmts.map((s,i)=>`<button class="${a===i?'y':''}" data-sel="${q}" data-i="${i}">${esc(lb[i])}</button>`).join('')+`</span>`; }
      else if(v.stmts.length>=2)
        ans=`<span class="yn"><button class="${a===true?'y':''}" data-yn="${q}" data-v="1">${esc(v.stmts[0].replace(/^.*\s/,'')||'있음')}</button>
             <button class="${a===false?'n':''}" data-yn="${q}" data-v="0">${esc(v.stmts[1].replace(/^.*\s/,'')||'없음')}</button></span>`;
      else ans=`<span class="yn"><button class="${a===true?'y':''}" data-yn="${q}" data-v="1">확인함</button></span>`;
      h.push(`<div class="q ${miss?'miss':''}"><span class="t">${esc(v.q||'(질문 없음)')}</span>${ans}</div>`);
    });
    h.push(`</div>`);

    /* 자동 — 진단 · 평가 */
    h.push(`<div class="auto"><div class="hd">▼ 여기부터 자동입니다</div>`);
    const shown=st.dx.filter(d=>rec(d));
    if(!shown.length) h.push(`<div class="none">사정에 답하면 간호진단이 나옵니다.</div>`);
    shown.forEach(dx=>{
      h.push(`<div class="dxc ${on(dx.name)?'':'off'}"><div class="h">
        <span class="nm">${esc(dx.name)}</span>
        ${on(dx.name)?'<span class="tg">추천</span>':''}
        <button class="sw" data-off="${esc(dx.name)}">${on(dx.name)?'빼기':'넣기'}</button></div>`);
      if(on(dx.name)) h.push(`<div class="pe">`+peOf(dx).map(x=>
        `<div>🟡 ${esc(x.pe)}${x.say?`<span>📢 “${esc(x.say)}”</span>`:''}</div>`).join('')+`</div>`);
      h.push(`</div>`);
    });
    h.push(`<div class="dxc ${S.fall?'':'off'}" style="border-left-color:var(--pe)"><div class="h">
      <span class="nm" style="color:var(--pe)">낙상위험</span>
      ${S.fall?'<span class="tg" style="color:var(--pe);background:var(--peb);border-color:var(--pe)">기본</span>':''}
      <button class="sw" data-fall="1">${S.fall?'빼기':'넣기'}</button></div>
      ${S.fall?`<div class="pe"><div>🟡 낙상방지 교육함</div><div>🟡 침대 난간을 올려줌</div></div>`:''}</div>`);
    h.push(`</div>`);

    /* 도관 · 비고 */
    h.push(`<details><summary>＋ 도관 · 비고</summary><div class="sec" style="margin-top:8px">
      <div class="row">`+D.cath.filter(c=>c.top).map(c=>
        `<button class="b ${S.cath[c.s]?'on':''}" data-ct="${esc(c.s)}">${esc(c.s)}</button>`).join('')+`</div>`
      + D.cath.filter(c=>S.cath[c.s]).map(c=>`<p class="lb" style="margin-top:12px">${esc(c.s)}</p><div class="row">`
        + c.d.map(d=>`<button class="b ${(S.cath[c.s]||[]).includes(d)?'on':''}" data-cd="${esc(c.s)}" data-v="${esc(d)}">${esc(d)}</button>`).join('')+`</div>`).join('')
      + `<p class="lb" style="margin-top:14px">📌 비고</p>
         <input id="memo" class="tin" style="width:100%" placeholder="횟수·부위·지속시간 등" value="${esc(S.memo)}">
      </div></details>`);
  }

  /* 기록 */
  const t=text();
  h.push(`<div class="rec"><div class="h">📋 복사될 내용 <span>${t?t.split('\n').filter(Boolean).length:0}줄</span></div>
    <pre>${esc(t||'주호소를 고르고 답하면 여기에 만들어집니다.')}</pre></div>
    <p class="hint">위 <b>📤 복사</b>를 누르면 그대로 복사됩니다. 카톡·네이버웍스·EMR 어디든 붙여넣으세요.</p>`);

  $('w').innerHTML=h.join('');
  save();
}

/* ── 이벤트 ── */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-sym],[data-s1],[data-s2],[data-yn],[data-sel],[data-off],[data-fall],[data-ct],[data-cd],[data-reset]');
  if(!b) return; const d=b.dataset;
  if(d.reset){ S.sym=S.s1=S.s2=S.set=''; S.ans={}; S.off=[]; }
  else if(d.sym){ S.sym=d.sym; S.s1=S.s2=S.set=''; S.ans={}; }
  else if(d.s1){ S.s1=d.s1; S.s2=''; }
  else if(d.s2){ S.s2=d.s2; }
  else if(d.yn){ const v=d.v==='1'; S.ans[d.yn]=S.ans[d.yn]===v?undefined:v; }
  else if(d.sel){ const i=+d.i; S.ans[d.sel]=S.ans[d.sel]===i?undefined:i; }
  else if(d.off){ const i=S.off.indexOf(d.off); i<0?S.off.push(d.off):S.off.splice(i,1); }
  else if(d.fall){ S.fall=!S.fall; }
  else if(d.ct){ S.cath[d.ct]?delete S.cath[d.ct]:S.cath[d.ct]=[]; }
  else if(d.cd){ const a=S.cath[d.cd]||(S.cath[d.cd]=[]); const i=a.indexOf(d.v); i<0?a.push(d.v):a.splice(i,1); }
  view();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nm'){S.nm=t.value;save();return;}
  if(t.id==='id'){S.id=t.value;save();return;}
  if(t.id==='memo'){S.memo=t.value;save();return;}
  if(t.dataset.in){S.ans[t.dataset.in]=t.value;save();}
});
$('cp').onclick=()=>{
  const t=text();
  if(!t){alert('아직 기록이 없습니다.');return;}
  const done=()=>{const b=$('cp');b.textContent='✅ 복사됨';b.classList.add('done');
    setTimeout(()=>{b.textContent='📤 복사';b.classList.remove('done')},1600);};
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(()=>prompt('길게 눌러 복사:',t));
  else prompt('길게 눌러 복사:',t);
};
$('nm').value=S.nm; $('id').value=S.id;
view();
</script>
</body></html>

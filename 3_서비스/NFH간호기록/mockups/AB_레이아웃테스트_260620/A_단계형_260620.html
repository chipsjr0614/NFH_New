<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFH 간호기록 — A 단계형 (레이아웃 테스트)</title>
<link rel="stylesheet" href="nfh_style_260620.css">
<style>main{padding-bottom:96px}</style>
</head>
<body>
<header>
  <div class="htop">
    <div class="logo">NFH <em>간호기록</em> · A 단계형</div>
    <span class="badge" id="stepbadge">1 / 4</span>
    <button onclick="resetAll()">🏠 처음</button>
  </div>
  <div class="progress" id="prog">
    <div class="pstep on"></div><div class="pstep"></div><div class="pstep"></div><div class="pstep"></div>
  </div>
</header>

<main>
  <!-- S1 주증상 -->
  <div id="s-symptom" class="screen active">
    <div class="hint">💡 한 번에 한 덩어리씩 진행합니다. 주증상을 고르고 <b>다음</b>을 누르면, 증상마다 사정 화면이 차례로 나와요.</div>
    <div class="screen-title">① 주증상</div>
    <div class="screen-sub">해당하는 증상을 모두 고르세요 (여러 개 가능)</div>
    <div class="sym-grid" id="symptom-grid"></div>
  </div>

  <!-- S2 분기 -->
  <div id="s-branch" class="screen"><div id="branch-body"></div></div>

  <!-- S3 사정 (주호소별) -->
  <div id="s-assess" class="screen"><div id="assess-body"></div></div>

  <!-- S4 의식/낙상 + 진단 검토 -->
  <div id="s-fall" class="screen">
    <div class="screen-title">의식 / 낙상 · 기록 검토</div>
    <div class="screen-sub">마지막으로 의식·낙상을 확인하고, 진단을 검토하세요.</div>
    <div id="fall-body"></div>
    <div id="dx-review"></div>
  </div>
</main>

<!-- 하단 네비 -->
<div class="navbar"><div class="inner" id="nav"></div></div>

<!-- 최종 기록 팝업 -->
<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-h"><div class="popup-title">📋 간호기록 — 간호일지</div><button onclick="closePopup()">닫기</button></div>
    <div class="popup-body" id="popup-body"></div>
    <div class="popup-foot"><button class="btn go" onclick="copyNote()">📤 EMR용 복사</button></div>
  </div>
</div>

<script src="nfh_core_260620.js"></script>
<script src="nfh_ui_260620.js"></script>
<script>
const N=window.NFH, U=window.NFHUI;
const ge=id=>document.getElementById(id);
let symQueue=[], curEntry=null, picked=[];

function goto(name, stepIdx){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  ge('s-'+name).classList.add('active');
  window.scrollTo(0,0);
  if(stepIdx!=null){
    ge('stepbadge').textContent = (stepIdx+1)+' / 4';
    [...ge('prog').children].forEach((d,i)=>{ d.className='pstep'+(i<stepIdx?' done':i===stepIdx?' on':''); });
  }
}
function setNav(html){ ge('nav').innerHTML=html; }

// ── S1 주증상 ──
function renderSymptom(){
  ge('symptom-grid').innerHTML = N.SYMS.map(s=>`<div class="opt-btn ${picked.includes(s.id)?'on':''}" data-sym="${s.id}"><span class="ico">${s.icon}</span>${s.label}</div>`).join('');
  goto('symptom',0);
  setNav(`<button class="btn prim" onclick="startQueue()">다음 →</button>`);
}
ge('symptom-grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-sym]'); if(!b) return;
  const id=b.dataset.sym;
  if(id==='ok'){ picked = picked.includes('ok')?[]:['ok']; }
  else { picked=picked.filter(x=>x!=='ok'); const i=picked.indexOf(id); i>=0?picked.splice(i,1):picked.push(id); }
  renderSymptom();
});
function startQueue(){
  if(!picked.length){ alert('주증상을 선택하세요'); return; }
  U.reset();
  if(picked.includes('ok')){ goFall(); return; }
  symQueue=[...picked]; nextSym();
}

// ── 분기 → 사정 ──
function nextSym(){
  if(!symQueue.length){ goFall(); return; }
  const sym=N.SYMS.find(s=>s.id===symQueue[0]);
  if(sym.skipToFall){ symQueue.shift(); return nextSym(); }
  if(sym.direct){ symQueue.shift(); openAssess([sym.direct], sym.label); return; }
  if(sym.branch){ renderBranch(sym.branch, sym.label); return; }
  symQueue.shift(); nextSym();
}
function renderBranch(branchId, label){
  const br=N.BRANCHES[branchId];
  ge('branch-body').innerHTML = `<div class="screen-title">${N.esc(label)}</div>
    ${br.hint?`<div class="screen-sub">💬 ${N.esc(br.hint)}</div>`:'<div style="height:8px"></div>'}
    <div class="q"><div class="q-prompt">${N.esc(br.q)}</div>
    <div class="opt-grid c1" id="br-opts">${br.opts.map((o,i)=>`<div class="opt-btn" data-bi="${i}">${N.esc(o.label)}</div>`).join('')}</div></div>`;
  goto('branch',0);
  setNav(`<button class="btn ghost" onclick="renderSymptom()">← 주증상</button>`);
  ge('br-opts').addEventListener('click', function h(e){
    const btn=e.target.closest('[data-bi]'); if(!btn) return;
    ge('br-opts').removeEventListener('click',h);
    const o=br.opts[+btn.dataset.bi];
    if(o.next) renderBranch(o.next, label);
    else if(o.key){ symQueue.shift(); openAssess(o.key, label+' · '+o.label); }
  });
}
function openAssess(key, label){
  curEntry = U.addComplaint(label, [key]) || U.S.selected.find(e=>e.label===label);
  ge('assess-body').innerHTML = U.assessHTML(curEntry);
  U.bindAssess(ge('assess-body'), curEntry);
  goto('assess',1);
  const more = symQueue.length>0;
  setNav(`<button class="btn ghost" onclick="backFromAssess()">← 뒤로</button>
    <button class="btn prim" onclick="nextSym()">${more?'다음 증상 →':'의식·낙상 →'}</button>`);
  U.fire();
}
function backFromAssess(){ if(curEntry){ U.removeComplaint(curEntry.id); } renderSymptom(); }

// ── S4 의식/낙상 + 진단 검토 ──
function goFall(){
  ge('fall-body').innerHTML = U.fallHTML();
  U.bindFall(ge('fall-body'));
  goto('fall',2);
  renderDxReview();
  setNav(`<button class="btn ghost" onclick="renderSymptom()">← 주증상</button>
    <button class="btn go" onclick="openPopup()">기록 완성 →</button>`);
}
function renderDxReview(){ ge('dx-review').innerHTML = U.dxHTML(); }
U.onChange = ()=>{ if(ge('s-fall').classList.contains('active')) renderDxReview();
  if(ge('overlay').classList.contains('on')) ge('popup-body').innerHTML=U.previewHTML(); };

// ── 팝업 ──
function openPopup(){ ge('popup-body').innerHTML=U.previewHTML(); ge('overlay').classList.add('on'); goto('fall',3); }
function closePopup(){ ge('overlay').classList.remove('on'); goto('fall',2); }
function copyNote(){
  const t=U.recordText(); if(!t){ alert('기록이 비어 있습니다'); return; }
  navigator.clipboard?.writeText(t).then(()=>alert('복사됨! EMR에 붙여넣으세요.')).catch(()=>prompt('복사:',t));
}
function resetAll(){ picked=[]; symQueue=[]; curEntry=null; U.reset(); closePopup(); renderSymptom(); }

renderSymptom();
</script>
</body>
</html>

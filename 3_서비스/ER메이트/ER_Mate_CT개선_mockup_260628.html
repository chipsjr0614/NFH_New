<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ER Mate · 검사 준비 mockup (CT·MRI)</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e1e6ee;--tx:#1d2733;--tx2:#6b7789;
  --blue:#2563eb;--blueL:#eef4ff;--green:#16a34a;--greenL:#e9f9ef;--warn:#dc2626;--warnL:#fdecec;
  --badge:#0e7490;--badgeL:#e0f5fa;--why:#7c3aed;--whyL:#f3edff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.hd h1{font-size:22px;margin:0}.hd .sub{color:var(--tx2);font-size:13px}
.note{background:#fff8e1;border:1px solid #f3e0a0;border-radius:10px;padding:10px 13px;font-size:13px;color:#7a5d00;margin-bottom:14px}
/* 시술 탭 */
.ptabs{display:flex;gap:8px;margin-bottom:14px}
.ptab{flex:1;text-align:center;padding:13px;border-radius:13px;border:2px solid var(--line);background:var(--card);
  font-weight:800;font-size:17px;cursor:pointer;color:var(--tx2);transition:.15s}
.ptab.on{border-color:var(--tx);background:var(--tx);color:#fff}
/* 분기 토글 */
.branch{display:flex;gap:8px;margin-bottom:14px}
.btab{flex:1;text-align:center;padding:13px;border-radius:13px;border:2px solid var(--line);background:var(--card);
  font-weight:800;font-size:15.5px;cursor:pointer;color:var(--tx2);transition:.15s}
.btab .d{font-size:11px;font-weight:500;margin-top:3px;opacity:.85}
.btab.on{border-color:var(--blue);background:var(--blueL);color:var(--blue)}
/* 진행 */
.prog{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.pbar{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.pfill{height:100%;background:var(--green);width:0;transition:.25s}
.ptx{font-size:13px;color:var(--tx2);font-weight:700;min-width:36px;text-align:right}
.sec{margin:16px 0 7px;font-size:13px;font-weight:800;color:var(--blue);letter-spacing:.3px}
.it{background:var(--card);border:1.5px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;transition:.15s}
.it.warn{border-color:#f3c0c0}
.it.done{background:var(--greenL);border-color:#bfe6cc}
.irow{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer}
.ck{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;margin-top:1px}
.it.done .ck{background:var(--green);border-color:var(--green)}
.ic{flex:0 0 26px;font-size:22px;text-align:center;margin-top:-1px}
.body{flex:1;min-width:0}
.tx{font-size:15.5px;font-weight:600}
.it.warn .tx{color:#a01818}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.badge{background:var(--badgeL);color:var(--badge);font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px}
.req{background:var(--warnL);color:var(--warn);font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px}
.whyb{background:var(--whyL);color:var(--why);font-size:12px;font-weight:800;padding:4px 11px;border-radius:20px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px}
.why{display:none;margin:0 14px 13px 51px;padding:11px 13px;background:var(--whyL);border-radius:10px;
  font-size:13.5px;color:#4b2a86;border-left:3px solid var(--why)}
.why.open{display:block}
.gate{position:sticky;bottom:10px;margin-top:14px;padding:16px;border-radius:14px;text-align:center;
  font-weight:800;font-size:16px;background:#eef1f6;color:var(--tx2);border:2px dashed var(--line)}
.gate.ok{background:var(--greenL);color:var(--green);border:2px solid var(--green)}
/* 간호기록 차팅 */
.chart{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px}
.chd{font-weight:800;font-size:15.5px;margin-bottom:4px;color:var(--tx)}
.chsub{font-size:12.5px;color:var(--tx2);margin-bottom:12px}
.cbtns{display:flex;gap:8px;margin-bottom:12px}
.cbtn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:15px;cursor:pointer;color:var(--tx2);transition:.15s}
.cbtn.on{border-color:var(--green);background:var(--greenL);color:var(--green)}
#chartTx{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:11px;padding:13px;font-size:14.5px;font-family:inherit;line-height:1.7;resize:vertical;background:#fafbfd;color:var(--tx)}
.copy{margin-top:10px;width:100%;padding:14px;border-radius:12px;border:none;background:var(--green);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer}
.copy:active{opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><span style="font-size:26px" id="hdIc">🩻</span><div><h1 id="hdT">CT 조영제</h1><div class="sub" id="hdS">준비물형 — 개선 mockup</div></div></div>
  <div class="note">💡 <b>mockup 시안</b> — 항목 문구·차팅은 엑셀/마스터 원문 그대로입니다. [왜?]는 신규 간호사용 교육 설명입니다. 위 탭으로 CT·MRI를 전환해 보세요.</div>

  <div class="ptabs" id="ptabs"></div>
  <div class="branch" id="branch"></div>
  <div class="prog"><div class="pbar"><div class="pfill" id="pf"></div></div><div class="ptx" id="pt">0/0</div></div>
  <div id="list"></div>
  <div class="gate" id="gate">🔒 필수항목 남음</div>

  <div class="chart">
    <div class="chd">📋 간호기록 — 검사 이송 차팅</div>
    <div class="chsub">버튼을 누르면 해당 시점 차팅 문구가 생성됩니다 (마스터 원문)</div>
    <div class="cbtns">
      <button class="cbtn" id="cbSend" onclick="toggleChart('send')">📤 검사실 보냄</button>
      <button class="cbtn" id="cbBack" onclick="toggleChart('back')">📥 검사실에서 돌아옴</button>
    </div>
    <textarea id="chartTx" readonly placeholder="위 버튼을 누르면 차팅 문구가 여기에 생성됩니다."></textarea>
    <button class="copy" onclick="copyChart()">📋 EMR 복사</button>
  </div>
</div>

<script>
// 시술 데이터 — t=엑셀 원문, br=분기(both/분기id), w=필수, badge=핵심수치, why=교육설명 / chart=마스터 원문 차팅
const PROCS={
 ct:{name:'CT 조영제',tag:'준비물형 · CT(변경중)',ic:'🩻',
  branches:[{id:'contrast',l:'💉 조영 CT',d:'조영제 사용 — 동의서·GFR·IV·알러지'},{id:'non',l:'⚪ 비조영 CT',d:'조영제 없음 — 귀금속 제거 위주'}],
  items:[
   {ic:'📝',sec:'준비사항',br:'contrast',t:'CT동의서 준비(조영제 사용시)',why:'조영제는 드물게 알러지·신장 부작용이 있을 수 있어, 검사 전 환자에게 설명하고 동의를 받아요.'},
   {ic:'👕',sec:'준비사항',br:'both',t:'환의(아래 속옷만 입힌다)로 갈아입기 + 귀금속(귀걸이 목걸이 등) 제거 - 영상 방해될 수 있음',why:'금속(귀금속·단추·와이어)은 CT 영상에 줄무늬 인공물(artifact)을 만들어 판독을 방해해요.'},
   {ic:'🫘',sec:'준비사항',br:'contrast',w:true,badge:'GFR 60↑',t:'GFR 60 이상 확인.(60미만일 시 주치의 확인 필요)',why:'조영제는 콩팥(신장)으로 빠져나가요. 신장 기능이 나쁘면(GFR 60 미만) 조영제 신독성 위험이 있어 주치의 확인이 필요해요.'},
   {ic:'💉',sec:'준비사항',br:'contrast',badge:'20G↑ · 손목 위',t:'20G 이상 손목 위 Pressure line IV (Non-Contrast)는 필요없음)',why:'조영제를 빠른 속도로 자동 주입(pressure injector)하기 때문에 굵은(20G 이상) 바늘이 필요하고, 터지지 않게 손목 위쪽에 잡아요.'},
   {ic:'💊',sec:'준비사항',br:'contrast',badge:'Avil 30min · 스테로이드 1hr',t:'조영제 알러지 시 전처치: Avil 다 들어간 후 30min, 스테로이드는 1hr 후 촬영',why:'조영제 알러지 과거력이 있으면 반응을 예방하려고 항히스타민(Avil)·스테로이드를 미리 투여하고, 약효가 오를 시간을 두고 촬영해요.'},
   {ic:'📞',sec:'준비사항',br:'contrast',t:'전처치 시작 전 CT실 전화해서 투약 시간 확인',why:'전처치 약효 도달 시간에 맞춰 촬영 타이밍을 조율하기 위해 미리 CT실과 시간을 맞춰요.'},
   {ic:'🖥️',sec:'검사 후',br:'both',t:'15분 후 영상병동뷰어 영상 올라왔는지 확인',why:'촬영 누락이나 재촬영이 필요한지 빠르게 확인해 검사 지연을 막아요.'},
   {ic:'❤️',sec:'주의사항',br:'contrast',badge:'HR>70 → betaloc',t:'CT Heart angio+3D: TNI 확인 & HR>70 → betaloc 후 30분 f/u',why:'심장 CT는 심박이 빠르면(>70) 영상이 흔들려 혈관이 안 보여요. 베타차단제(betaloc)로 심박을 낮춰 선명하게 찍어요.'},
   {ic:'🚑',sec:'이송 부서',br:'both',t:'응급CT (☏)',why:'CT 촬영은 응급CT실로 환자를 이송해 진행해요.'},
  ],
  chart:{send:{both:['검사실 보냄','검진 위해 이송함'],contrast:['금식 확인함']},
         back:{both:['검사실에서 돌아옴','검사 후 응급실 돌아와 관찰 중임'],contrast:['조영제 부작용이 있는지 관찰함 ★']}}
 },
 mri:{name:'MRI',tag:'준비물형 · MRI',ic:'🧲',
  branches:[{id:'sed',l:'💤 진정(Sedation)',d:'진정제 사용 — 호흡·모니터 필요'},{id:'nosed',l:'😊 비진정',d:'진정 없음 — 금속 제거 위주'}],
  items:[
   {ic:'🧲',sec:'준비사항',br:'both',w:true,badge:'⚠️ 금속 제거',t:'금속물질(안경, 보청기, 틀니, ECG lead, SPO2 sensor, 뇌심부자극기, pacemaker 등) 제거된 지 직접 확인 및 질문.',why:'MRI는 매우 강한 자석을 써요. 몸에 금속이 있으면 끌려가거나 열이 나 화상·영상 왜곡 위험이 있어 반드시 직접 확인·질문해요.'},
   {ic:'📝',sec:'준비사항',br:'both',t:'MRI 동의서 준비(조영제 사용시)',why:'조영제를 쓰는 경우 부작용 가능성을 설명하고 동의를 받아요. (비조영이면 불필요)'},
   {ic:'💉',sec:'준비사항',br:'both',badge:'20G↑ · 손목 위',t:'20G 이상 손목 위 Pressure line IV (Non-Contrast)는 필요없음)',why:'조영제를 빠르게 자동 주입하기 위해 굵은(20G↑) 바늘을 손목 위에 잡아요. (비조영이면 불필요)'},
   {ic:'🫘',sec:'준비사항',br:'both',badge:'GFR 60↑',t:'GFR 60 이상 확인.(60미만일 시 주치의 확인 필요)',why:'조영제는 콩팥으로 빠져나가요. 신장 기능이 나쁘면 조영제 신독성 위험이 있어 확인해요.'},
   {ic:'😴',sec:'준비사항',br:'sed',t:'Sedation 시: midazolam #1 출발 시 IVS 준비물: O2, mask/nasal, ambu, O2 line, fitting mask',why:'진정 중 호흡이 억제될 수 있어 산소·앰부 등 응급 호흡 장비를 미리 준비해요.'},
   {ic:'🩺',sec:'준비사항',br:'sed',t:'Sedation tl 이송모니터 + 의료진 동반',why:'진정된 환자는 이송 중에도 활력징후·산소포화도 감시와 의료진 동반이 필요해요.'},
   {ic:'🫁',sec:'검사 후',br:'sed',t:'Sedation 후 의식/호흡 확인',why:'진정에서 깨어나는 동안 의식과 호흡이 정상으로 돌아오는지 확인해요.'},
   {ic:'🚑',sec:'이송 부서',br:'both',t:'응급 MRI (☏)',why:'MRI 촬영은 응급MRI실로 이송해 진행해요.'},
  ],
  chart:{send:{both:['검사실 보냄','검진 위해 이송함','금속물 제거 교육함'],sed:['처방에 의해 Midazolam 을 투여함','산소포화도 monitor 하면서 보냄']},
         back:{both:['검사실에서 돌아옴','검사 후 응급실 돌아와 관찰 중임'],sed:['의식상태 사정함','산소포화도 monitor 중임']}}
 }
};
let curProc='ct', branch='contrast';
const checks={}, chartOn={send:false,back:false};

function setProc(p){curProc=p;branch=PROCS[p].branches[0].id;
  for(const k in checks)delete checks[k];chartOn.send=false;chartOn.back=false;
  document.getElementById('cbSend').classList.remove('on');document.getElementById('cbBack').classList.remove('on');
  renderAll();}
function setBranch(b){branch=b;renderAll();}
function tog(i){checks[i]=!checks[i];render();}
function toggleWhy(i){document.getElementById('why'+i).classList.toggle('open');}
function curItems(){return PROCS[curProc].items.map((it,i)=>({it,i})).filter(o=>o.it.br==='both'||o.it.br===branch);}

function renderTabs(){
  document.getElementById('ptabs').innerHTML=Object.keys(PROCS).map(k=>
    `<div class="ptab ${k===curProc?'on':''}" onclick="setProc('${k}')">${PROCS[k].ic} ${PROCS[k].name}</div>`).join('');
  const P=PROCS[curProc];
  document.getElementById('hdIc').textContent=P.ic;document.getElementById('hdT').textContent=P.name;document.getElementById('hdS').textContent=P.tag+' — 개선 mockup';
  document.getElementById('branch').innerHTML=P.branches.map(b=>
    `<div class="btab ${b.id===branch?'on':''}" onclick="setBranch('${b.id}')">${b.l}<div class="d">${b.d}</div></div>`).join('');
}
function render(){
  const vis=curItems();let html='',curSec='';
  vis.forEach(({it,i})=>{
    if(it.sec!==curSec){curSec=it.sec;html+=`<div class="sec">${it.sec}</div>`;}
    const on=checks[i];
    const badge=it.badge?`<span class="badge">${it.badge}</span>`:'';
    const req=it.w?`<span class="req">⚠️ 필수</span>`:'';
    html+=`<div class="it ${it.w?'warn':''} ${on?'done':''}">
      <div class="irow">
        <div class="ck" onclick="tog(${i})">${on?'✓':''}</div>
        <div class="ic">${it.ic}</div>
        <div class="body"><div class="tx" onclick="tog(${i})">${it.t}</div>
          <div class="meta">${badge}${req}<button class="whyb" onclick="toggleWhy(${i})">💡 왜?</button></div></div>
      </div>
      <div class="why" id="why${i}">${it.why}</div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
  const tot=vis.length,done=vis.filter(o=>checks[o.i]).length;
  const reqs=vis.filter(o=>o.it.w),reqDone=reqs.filter(o=>checks[o.i]).length;
  document.getElementById('pf').style.width=(tot?done/tot*100:0)+'%';
  document.getElementById('pt').textContent=done+'/'+tot;
  const ok=reqs.length?reqDone===reqs.length:done===tot&&tot>0;
  const g=document.getElementById('gate');g.className='gate'+(ok?' ok':'');
  g.textContent=ok?'🚑 이송 준비 완료':(reqs.length?`🔒 필수항목(${reqDone}/${reqs.length}) 남음`:`🔒 ${done}/${tot} 진행 중`);
}
function renderAll(){renderTabs();render();renderChart();}

function toggleChart(k){chartOn[k]=!chartOn[k];
  document.getElementById(k==='send'?'cbSend':'cbBack').classList.toggle('on',chartOn[k]);renderChart();}
function renderChart(){
  const C=PROCS[curProc].chart;const lines=[];
  ['send','back'].forEach(k=>{if(chartOn[k]){const c=C[k];
    const arr=[...c.both,...(c[branch]||[])];
    lines.push('['+(k==='send'?'검사실 보냄':'검사실에서 돌아옴')+']');arr.forEach(x=>lines.push(' · '+x));lines.push('');}});
  document.getElementById('chartTx').value=lines.join('\n').trim();
}
function copyChart(){const t=document.getElementById('chartTx');
  if(!t.value){alert('먼저 보냄/돌아옴 버튼을 눌러주세요');return;}
  t.select();document.execCommand('copy');
  const b=event.target;const o=b.textContent;b.textContent='✓ 복사됨';setTimeout(()=>b.textContent=o,1200);}

renderAll();
</script>
</body>
</html>

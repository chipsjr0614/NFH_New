<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ER Mate · CT 개선 mockup</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e1e6ee;--tx:#1d2733;--tx2:#6b7789;
  --blue:#2563eb;--blueL:#eef4ff;--green:#16a34a;--greenL:#e9f9ef;--warn:#dc2626;--warnL:#fdecec;
  --badge:#0e7490;--badgeL:#e0f5fa;--why:#7c3aed;--whyL:#f3edff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hd{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.hd h1{font-size:22px;margin:0}.hd .sub{color:var(--tx2);font-size:13px}
.note{background:#fff8e1;border:1px solid #f3e0a0;border-radius:10px;padding:10px 13px;font-size:13px;color:#7a5d00;margin-bottom:14px}
/* 분기 토글 */
.branch{display:flex;gap:8px;margin-bottom:14px}
.btab{flex:1;text-align:center;padding:14px;border-radius:13px;border:2px solid var(--line);background:var(--card);
  font-weight:800;font-size:16px;cursor:pointer;color:var(--tx2);transition:.15s}
.btab .d{font-size:11.5px;font-weight:500;margin-top:3px;opacity:.85}
.btab.on{border-color:var(--blue);background:var(--blueL);color:var(--blue)}
/* 진행 */
.prog{display:flex;align-items:center;gap:10px;margin:4px 2px 14px}
.pbar{flex:1;height:9px;background:var(--line);border-radius:6px;overflow:hidden}
.pfill{height:100%;background:var(--green);width:0;transition:.25s}
.ptx{font-size:13px;color:var(--tx2);font-weight:700;min-width:36px;text-align:right}
/* 섹션 */
.sec{margin:16px 0 7px;font-size:13px;font-weight:800;color:var(--blue);letter-spacing:.3px}
/* 항목 */
.it{background:var(--card);border:1.5px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;transition:.15s}
.it.warn{border-color:#f3c0c0}
.it.done{background:var(--greenL);border-color:#bfe6cc}
.irow{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;cursor:pointer}
.ck{flex:0 0 24px;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;margin-top:1px}
.it.done .ck{background:var(--green);border-color:var(--green)}
.ic{flex:0 0 26px;font-size:22px;text-align:center;margin-top:-1px}
.body{flex:1;min-width:0}
.tx{font-size:15.5px;font-weight:600}
.it.warn .tx{color:#a01818}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.badge{background:var(--badgeL);color:var(--badge);font-size:12px;font-weight:800;padding:3px 9px;border-radius:8px}
.req{background:var(--warnL);color:var(--warn);font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px}
.whyb{background:var(--whyL);color:var(--why);font-size:12px;font-weight:800;padding:4px 11px;border-radius:20px;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:4px}
.why{display:none;margin:0 14px 13px 51px;padding:11px 13px;background:var(--whyL);border-radius:10px;
  font-size:13.5px;color:#4b2a86;border-left:3px solid var(--why)}
.why.open{display:block}
.why .vchk{display:block;margin-top:6px;font-size:11.5px;color:#8a6fc0;font-weight:700}
/* 게이트 */
.gate{position:sticky;bottom:10px;margin-top:14px;padding:16px;border-radius:14px;text-align:center;
  font-weight:800;font-size:16px;background:#eef1f6;color:var(--tx2);border:2px dashed var(--line)}
.gate.ok{background:var(--greenL);color:var(--green);border:2px solid var(--green)}
.hide{display:none}
/* 간호기록 차팅 */
.chart{margin-top:18px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:15px}
.chd{font-weight:800;font-size:15.5px;margin-bottom:4px;color:var(--tx)}
.chsub{font-size:12.5px;color:var(--tx2);margin-bottom:12px}
.cbtns{display:flex;gap:8px;margin-bottom:12px}
.cbtn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-weight:800;font-size:15px;cursor:pointer;color:var(--tx2);transition:.15s}
.cbtn.on{border-color:var(--green);background:var(--greenL);color:var(--green)}
#chartTx{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:11px;padding:13px;font-size:14.5px;font-family:inherit;line-height:1.7;resize:vertical;background:#fafbfd;color:var(--tx)}
.copy{margin-top:10px;width:100%;padding:14px;border-radius:12px;border:none;background:var(--green);color:#fff;font-weight:800;font-size:15.5px;cursor:pointer}
.copy:active{opacity:.85}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><span style="font-size:26px">🩻</span><div><h1>CT 조영제</h1><div class="sub">준비물형 · CT(변경중) — 개선 mockup</div></div></div>

  <div class="note">💡 <b>mockup 시안</b> — 항목 문구는 엑셀 원문 그대로입니다. <b>[왜?] 설명은 일반 의학상식 초안</b>이며 <b>★칩스 검증</b>이 필요합니다. 분기·아이콘·설명 방식이 마음에 드는지 봐주세요.</div>

  <!-- 분기 -->
  <div class="branch">
    <div class="btab on" id="bC" onclick="setBranch('contrast')">💉 조영 CT<div class="d">조영제 사용 — 동의서·GFR·IV·알러지 확인</div></div>
    <div class="btab" id="bN" onclick="setBranch('non')">⚪ 비조영 CT<div class="d">조영제 없음 — 귀금속 제거 위주</div></div>
  </div>

  <div class="prog"><div class="pbar"><div class="pfill" id="pf"></div></div><div class="ptx" id="pt">0/0</div></div>

  <div id="list"></div>

  <div class="gate" id="gate">🔒 필수항목 남음</div>

  <!-- 간호기록 차팅 -->
  <div class="chart">
    <div class="chd">📋 간호기록 — 검사 이송 차팅</div>
    <div class="chsub">버튼을 누르면 해당 시점 차팅 문구가 생성됩니다 (마스터 원문 · ★는 칩스 검증)</div>
    <div class="cbtns">
      <button class="cbtn" id="cbSend" onclick="toggleChart('send')">📤 검사실 보냄</button>
      <button class="cbtn" id="cbBack" onclick="toggleChart('back')">📥 검사실에서 돌아옴</button>
    </div>
    <textarea id="chartTx" readonly placeholder="위 버튼을 누르면 차팅 문구가 여기에 생성됩니다."></textarea>
    <button class="copy" onclick="copyChart()">📋 EMR 복사</button>
  </div>
</div>

<script>
// 항목: t=엑셀 원문, ic=아이콘, sec=섹션, br=분기(contrast/non/both), w=필수, badge=핵심수치, why=쉬운설명(★칩스검증)
const ITEMS=[
 {ic:'📝',sec:'준비사항',br:'contrast',t:'CT동의서 준비(조영제 사용시)',
   why:'조영제는 드물게 알러지·신장 부작용이 있을 수 있어, 검사 전 환자에게 설명하고 동의를 받아요.'},
 {ic:'👕',sec:'준비사항',br:'both',t:'환의(아래 속옷만 입힌다)로 갈아입기 + 귀금속(귀걸이 목걸이 등) 제거 - 영상 방해될 수 있음',
   why:'금속(귀금속·단추·와이어)은 CT 영상에 줄무늬 인공물(artifact)을 만들어 판독을 방해해요.'},
 {ic:'🫘',sec:'준비사항',br:'contrast',w:true,badge:'GFR 60↑',t:'GFR 60 이상 확인.(60미만일 시 주치의 확인 필요)',
   why:'조영제는 콩팥(신장)으로 빠져나가요. 신장 기능이 나쁘면(GFR 60 미만) 조영제 신독성 위험이 있어 주치의 확인이 필요해요.'},
 {ic:'💉',sec:'준비사항',br:'contrast',badge:'20G↑ · 손목 위',t:'20G 이상 손목 위 Pressure line IV (Non-Contrast)는 필요없음)',
   why:'조영제를 빠른 속도로 자동 주입(pressure injector)하기 때문에 굵은(20G 이상) 바늘이 필요하고, 터지지 않게 손목 위쪽에 잡아요.'},
 {ic:'💊',sec:'준비사항',br:'contrast',badge:'Avil 30min · 스테로이드 1hr',t:'조영제 알러지 시 전처치: Avil 다 들어간 후 30min, 스테로이드는 1hr 후 촬영',
   why:'조영제 알러지 과거력이 있으면 반응을 예방하려고 항히스타민(Avil)·스테로이드를 미리 투여하고, 약효가 오를 시간을 두고 촬영해요.'},
 {ic:'📞',sec:'준비사항',br:'contrast',t:'전처치 시작 전 CT실 전화해서 투약 시간 확인',
   why:'전처치 약효 도달 시간에 맞춰 촬영 타이밍을 조율하기 위해 미리 CT실과 시간을 맞춰요.'},
 {ic:'🖥️',sec:'검사 후',br:'both',t:'15분 후 영상병동뷰어 영상 올라왔는지 확인',
   why:'촬영 누락이나 재촬영이 필요한지 빠르게 확인해 검사 지연을 막아요.'},
 {ic:'❤️',sec:'주의사항',br:'contrast',badge:'HR>70 → betaloc',t:'CT Heart angio+3D: TNI 확인 & HR>70 → betaloc 후 30분 f/u',
   why:'심장 CT는 심박이 빠르면(>70) 영상이 흔들려 혈관이 안 보여요. 베타차단제(betaloc)로 심박을 낮춰 선명하게 찍어요.'},
 {ic:'🚑',sec:'이송 부서',br:'both',t:'응급CT (☏)',
   why:'CT 촬영은 응급CT실로 환자를 이송해 진행해요.'},
];
let branch='contrast';
const checks={};
function setBranch(b){branch=b;document.getElementById('bC').classList.toggle('on',b==='contrast');
  document.getElementById('bN').classList.toggle('on',b==='non');render();renderChart();}
// 간호기록 차팅 (마스터 원문 · ★=칩스 검증)
const CHART={
  send:{lab:'검사실 보냄', both:['검사실 보냄','검진 위해 이송함'], contrast:['금식 확인함']},
  back:{lab:'검사실에서 돌아옴', both:['검사실에서 돌아옴','검사 후 응급실 돌아와 관찰 중임'], contrast:['조영제 부작용이 있는지 관찰함 ★']}
};
const chartOn={send:false,back:false};
function toggleChart(k){chartOn[k]=!chartOn[k];
  document.getElementById(k==='send'?'cbSend':'cbBack').classList.toggle('on',chartOn[k]);renderChart();}
function renderChart(){
  const lines=[];
  ['send','back'].forEach(k=>{if(chartOn[k]){const c=CHART[k];
    const arr=[...c.both,...(branch==='contrast'?c.contrast:[])];
    lines.push('['+c.lab+']');arr.forEach(x=>lines.push(' · '+x));lines.push('');}});
  document.getElementById('chartTx').value=lines.join('\n').trim();
}
function copyChart(){const t=document.getElementById('chartTx');
  if(!t.value){alert('먼저 보냄/돌아옴 버튼을 눌러주세요');return;}
  t.select();document.execCommand('copy');
  const b=event.target;const o=b.textContent;b.textContent='✓ 복사됨';setTimeout(()=>b.textContent=o,1200);}
function visible(){return ITEMS.map((it,i)=>({it,i})).filter(o=>o.it.br==='both'||o.it.br===branch);}
function tog(i){checks[i]=!checks[i];render();}
function toggleWhy(i){const e=document.getElementById('why'+i);e.classList.toggle('open');}
function render(){
  const vis=visible();let html='',curSec='';
  vis.forEach(({it,i})=>{
    if(it.sec!==curSec){curSec=it.sec;html+=`<div class="sec">${it.sec}</div>`;}
    const on=checks[i];
    const badge=it.badge?`<span class="badge">${it.badge}</span>`:'';
    const req=it.w?`<span class="req">⚠️ 필수</span>`:'';
    html+=`<div class="it ${it.w?'warn':''} ${on?'done':''}">
      <div class="irow">
        <div class="ck" onclick="tog(${i})">${on?'✓':''}</div>
        <div class="ic">${it.ic}</div>
        <div class="body">
          <div class="tx" onclick="tog(${i})">${it.t}</div>
          <div class="meta">${badge}${req}<button class="whyb" onclick="toggleWhy(${i})">💡 왜?</button></div>
        </div>
      </div>
      <div class="why" id="why${i}">${it.why}<span class="vchk">★ 칩스 검증 필요 (초안)</span></div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
  // 진행/게이트
  const tot=vis.length,done=vis.filter(o=>checks[o.i]).length;
  const reqs=vis.filter(o=>o.it.w),reqDone=reqs.filter(o=>checks[o.i]).length;
  document.getElementById('pf').style.width=(tot?done/tot*100:0)+'%';
  document.getElementById('pt').textContent=done+'/'+tot;
  const ok=reqs.length?reqDone===reqs.length:done===tot;
  const g=document.getElementById('gate');g.className='gate'+(ok?' ok':'');
  g.textContent=ok?'🚑 이송 준비 완료':(reqs.length?`🔒 필수항목(${reqDone}/${reqs.length}) 남음`:`🔒 ${done}/${tot} 진행 중`);
}
render();
</script>
</body>
</html>

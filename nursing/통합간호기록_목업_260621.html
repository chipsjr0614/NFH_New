 정신과:{label:'😰 불안·자해', ae:[{q:'"스스로 해치거나 죽고 싶은 생각?"',rec:'구체적 자살계획을 언급함'},{q:'공격적 행동?',rec:'공격적 행동함'},{q:'"불안·공황?"',rec:'공황상태 있음'}], dxs:[{name:'자살위험',cue:0,pe:[{say:'"혼자 두지 않고 안전하게 지켜드릴게요"',rec:'안전간호를 제공함'},{say:'"안전을 위해 행동을 관찰하겠습니다"',rec:'CCTV monitor 통해 행동 관찰함'}]},{name:'폭력위험:타인',cue:1,pe:[{say:'"진정하실 수 있게 곁에서 돕겠습니다"',rec:'진정시킴'},{say:'"안전을 위해 보호대를 적용하겠습니다"',rec:'억제대 적용 중임'}]},{name:'불안',cue:2,pe:[{say:'"천천히 호흡해 보세요, 제가 곁에 있을게요"',rec:'불안을 감소시켜 줌'},{say:'"편하게 말씀하세요"',rec:'경청해줌'}]}]},
 안과:{label:'👁️ 눈', ae:[{q:'"잘 안 보임(시력저하)?"',rec:'시력감퇴 있음'},{q:'"눈 충혈?"',rec:'결막충혈 있음'},{q:'"눈에 뭐가 들어감?"',rec:'이물질 관찰됨'}], dxs:[{name:'감각지각장애:시각',cue:0,pe:[{say:'"안전하게 부축해 드릴게요"',rec:'안전간호를 제공함'},{say:'"눈 보호를 위해 안대를 해드릴게요"',rec:'안대 적용함'}]},{name:'안위변화',cue:2,pe:[{say:'"눈에 들어간 것을 조심히 빼드릴게요"',rec:'이물질을 제거함'},{say:'"안연고 넣는 방법을 알려드릴게요"',rec:'안연고 점안 방법에 대해 교육함'}]}]},
 피부:{label:'🧴 피부', ae:[{q:'"가렵나요?"',rec:'가려움증 있음 ★'},{q:'"발진?"',rec:'발진 있음 ★'},{q:'"물집(bullae)?"',rec:'bullae 있음'}], dxs:[{name:'피부손상위험',cue:0,pe:[{say:'"긁지 마시고 살살 두드려 주세요"',rec:'긁지 않도록 교육함'},{say:'"가려움 줄이는 방법을 알려드릴게요"',rec:'소양증 감소 방법에 대해 교육함'}]},{name:'피부손상',cue:2,pe:[{say:'"피부 상태를 자주 살펴보겠습니다"',rec:'피부 상태를 관찰함'}]}]},
};
const ORDER=['통증','감염','출혈','호흡','대사','소화기','비뇨기','이비인후','어지럼','중독','신경심장','골절외상','의식섬망','정신과','안과','피부'];
let picked=[], st={};
/* 마무리 공통 (항상) */
let fix={consc:null, guard:null, edu:false};
const ge=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderCC(){ge('cc').innerHTML=ORDER.map(k=>`<div class="ccb ${picked.includes(k)?'on':''}" data-cc="${k}">${MODULES[k].label}</div>`).join('');}
function renderMods(){
 ge('mods').innerHTML=picked.map(k=>{const m=MODULES[k],s=st[k];
  const ae=m.ae.map((it,i)=>`<div class="q"><div class="qp">${esc(it.q)}</div><div class="opts"><div class="opt ${s.ae[i]===true?'pos':''}" data-m="${k}" data-ae="${i}">${s.ae[i]===true?'✓ ':''}${esc(it.rec)}</div><div class="opt ${s.ae[i]===false?'neg':''}" data-m="${k}" data-aeno="${i}">없음</div></div></div>`).join('');
  const dx=m.dxs.map((d,di)=>{const on=s.dx.includes(di),rec=s.ae[d.cue]===true;return `<div class="dxc ${on?'on':''}" data-m="${k}" data-dx="${di}"><div class="ck">${on?'✓':''}</div><b>${esc(d.name)}</b>${rec?'<span class="rec">추천</span>':''}</div>`;}).join('');
  let iv='';s.dx.forEach(di=>{const d=m.dxs[di];iv+=d.pe.map((p,pi)=>`<div class="iv ${s.pe[di+'_'+pi]?'on':''}" data-m="${k}" data-iv="${di}_${pi}"><div><span class="spk">📢</span>${esc(p.say)}</div><div class="r">→ ${esc(p.rec)} ${s.pe[di+'_'+pi]?'✓':''}</div></div>`).join('');});
  return `<div class="mod"><div class="mod-h">${esc(m.label)} 사정</div>${m.note?`<div class="sub" style="color:var(--pe)">${esc(m.note)}</div>`:''}<div class="blk">사정 (A&E)</div>${ae}<div class="blk">간호진단 — 클릭(필요한 만큼)</div>${dx}${s.dx.length?`<div class="blk">평가·중재 (📢)</div>${iv}`:''}</div>`;}).join('');
}
function renderFix(){
 ge('fix').innerHTML=`<div class="blk">의식</div><div class="opts"><div class="opt ${fix.consc==='clear'?'pos':''}" data-fc="clear">의식 명료함</div><div class="opt ${fix.consc==='low'?'neg':''}" data-fc="low">의식 저하</div></div>
 <div class="blk">보호자</div><div class="opts"><div class="opt ${fix.guard==='y'?'pos':''}" data-fg="y">상주함</div><div class="opt ${fix.guard==='n'?'neg':''}" data-fg="n">동행 안 함</div></div>
 <div class="blk">낙상 — 항상 포함 🔒</div><div class="dxc on" style="cursor:default"><div class="ck">✓</div><b>낙상위험</b><span class="rec">자동</span></div>
 <div class="iv ${fix.edu?'on':''}" data-fedu><div><span class="spk">📢</span>"침대에서 내려오실 땐 꼭 간호사를 불러주세요. 난간 올려드릴게요."</div><div class="r">→ 낙상방지 교육함 ${fix.edu?'✓':''}</div></div>`;
}
function render(){const L=[];let n=0;
 picked.forEach(k=>{const m=MODULES[k],s=st[k];const anyAE=m.ae.some((it,i)=>s.ae[i]===true);if(!s.dx.length&&!anyAE)return;
  L.push({c:'head',t:`[${esc(m.label)}]`});
  m.ae.forEach((it,i)=>{if(s.ae[i]===true){L.push({c:'ae',tg:'A&E',t:it.rec});n++;}});
  s.dx.forEach(di=>{L.push({c:'d',tg:'D',t:m.dxs[di].name});n++;m.dxs[di].pe.forEach((p,pi)=>{if(s.pe[di+'_'+pi]){L.push({c:'pe',tg:'P&E',t:p.rec});n++;}});});});
 /* 마무리 항상 */
 L.push({c:'fixhead',t:'[의식 · 낙상] 🔒'});
 if(fix.consc==='clear'){L.push({c:'ae',tg:'A&E',t:'의식 명료함'});n++;} else if(fix.consc==='low'){L.push({c:'ae',tg:'A&E',t:'의식수준 : (저하)'});n++;}
 if(fix.guard==='y'){L.push({c:'ae',tg:'A&E',t:'보호자 환자 옆에 상주하고 있음'});n++;} else if(fix.guard==='n'){L.push({c:'ae',tg:'A&E',t:'보호자 동행하지 않음'});n++;}
 L.push({c:'d',tg:'D',t:'낙상위험'});n++;
 if(fix.edu){L.push({c:'pe',tg:'P&E',t:'낙상방지 교육함'});n++;}
 ge('cnt').textContent=n+'줄';
 const has=picked.some(k=>{const s=st[k];return s.dx.length||MODULES[k].ae.some((it,i)=>s.ae[i]===true);})||fix.consc||fix.guard;
 ge('preview').innerHTML=has?L.map(x=>x.c==='head'?`<div class="rl head">${esc(x.t)}</div>`:x.c==='fixhead'?`<div class="rl head fixhead">${esc(x.t)}</div>`:`<div class="rl ${x.c}"><span class="tg">${x.tg}</span>${esc(x.t)}</div>`).join(''):'<div class="empty">증상을 선택하세요.</div>';
}
ge('cc').addEventListener('click',e=>{const b=e.target.closest('[data-cc]');if(!b)return;const k=b.dataset.cc;
 if(picked.includes(k)){picked=picked.filter(x=>x!==k);delete st[k];}else{picked.push(k);st[k]={ae:{},dx:[],pe:{}};}
 renderCC();renderMods();render();});
ge('mods').addEventListener('click',e=>{const el=e.target.closest('[data-m]');if(!el)return;const k=el.dataset.m,s=st[k];
 if(el.dataset.ae!=null){const i=+el.dataset.ae;s.ae[i]=s.ae[i]===true?undefined:true;}
 else if(el.dataset.aeno!=null){const i=+el.dataset.aeno;s.ae[i]=s.ae[i]===false?undefined:false;}
 else if(el.dataset.dx!=null){const di=+el.dataset.dx;s.dx.includes(di)?s.dx=s.dx.filter(x=>x!==di):s.dx.push(di);}
 else if(el.dataset.iv!=null){s.pe[el.dataset.iv]=!s.pe[el.dataset.iv];}
 renderMods();render();});
ge('fix').addEventListener('click',e=>{const el=e.target.closest('[data-fc],[data-fg],[data-fedu]');if(!el)return;
 if(el.dataset.fc!=null)fix.consc=fix.consc===el.dataset.fc?null:el.dataset.fc;
 else if(el.dataset.fg!=null)fix.guard=fix.guard===el.dataset.fg?null:el.dataset.fg;
 else fix.edu=!fix.edu;
 renderFix();render();});
function copyNote(){const t=ge('preview').innerText;if(!t||t.includes('증상을 선택')){alert('기록이 비어 있습니다');return;}navigator.clipboard?.writeText(t).then(()=>alert('복사됨! EMR에 붙여넣으세요.')).catch(()=>prompt('복사:',t));}
renderCC();renderFix();render();
</script></body></html>

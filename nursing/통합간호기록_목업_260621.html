<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFH 통합 간호기록 (목업 260621)</title>
<!-- 1단계: 통합 골격 + 핵심 10모듈. 진술문=정본/마스터 원문, [칩스확정]=마스터 미존재 칩스 지정. -->
<!-- 2단계 예정: 통증 부위/6종·SMC, 신경심장·골절외상·의식섬망·정신과·안과·피부 풀 이식 + 맞이확인 -->
<style>
:root{--bg:#0a0e14;--panel:#12181f;--card:#1a212b;--card2:#222b38;--line:#2a3441;--tx:#e6edf3;--tx2:#8b97a7;--pos:#ff4d5e;--ok:#2ecc71;--ae:#4aa8ff;--d:#ff6b6b;--pe:#ffc857;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:262px;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:10px}
header .logo{font-weight:800;font-size:16px}.logo em{color:var(--ok);font-style:normal}.pat{font-size:12px;color:var(--tx2);margin-left:auto}
main{max-width:520px;margin:0 auto;padding:14px}.sec{margin-bottom:18px}.sec-h{font-size:14px;font-weight:800;margin:4px 2px 10px}.sub{font-size:12px;color:var(--tx2);margin:-4px 2px 10px}
.cc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ccb{background:var(--card2);border:1.5px solid var(--line);border-radius:13px;padding:13px 5px;cursor:pointer;font-size:13.5px;color:var(--tx2);text-align:center;font-weight:700;line-height:1.3}.ccb.on{background:var(--ok);border-color:var(--ok);color:#04210f}
.mod{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:13px;padding:13px;margin-bottom:12px}
.mod-h{font-size:15px;font-weight:800;margin-bottom:6px}
.blk{font-size:11px;color:var(--tx2);font-weight:700;margin:11px 2px 6px;text-transform:uppercase;letter-spacing:.3px}
.q{margin-bottom:8px}.q .qp{font-size:13.5px;font-weight:600;margin-bottom:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}.opt{flex:1;min-width:54px;text-align:center;padding:9px 6px;border-radius:9px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx2);font-size:13.5px;font-weight:600;cursor:pointer}.opt.neg{border-color:#5a6878;color:var(--tx);background:#2a3038}.opt.pos{border-color:var(--pos);color:#fff;background:var(--pos)}
.dxc{display:flex;align-items:center;gap:9px;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer}.dxc .ck{width:19px;height:19px;border:2px solid var(--d);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}.dxc.on{border-color:var(--d);background:rgba(255,107,107,.08)}.dxc.on .ck{background:var(--d)}.dxc b{font-size:14px}.dxc .rec{margin-left:auto;font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:5px;padding:1px 6px}
.iv{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:6px;cursor:pointer;font-size:13px}.iv.on{border-color:var(--pe);background:rgba(255,200,87,.08)}.iv .spk{color:var(--pe);font-weight:800;margin-right:4px}.iv .r{font-size:11.5px;color:var(--tx2);margin-top:5px}.iv.on .r{color:var(--pe)}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:2px solid var(--line);max-height:252px;display:flex;flex-direction:column}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}.sh-h b{font-size:14px}.sh-h .c{font-size:12px;color:var(--tx2)}.sh-h button{margin-left:auto;background:var(--ok);color:#063;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.sh-b{overflow-y:auto;padding:10px 16px;max-width:520px;margin:0 auto;width:100%;font-size:13px;line-height:1.55}.rl{margin:1px 0}.rl .tg{font-weight:800;font-size:10px;margin-right:5px;display:inline-block;min-width:24px}.rl.ae{color:var(--ae)}.rl.d{color:var(--d)}.rl.pe{color:var(--pe)}.rl.head{color:var(--tx);font-weight:800;margin-top:7px}.empty{color:var(--tx2);font-size:13px}
.hint{font-size:12px;color:var(--tx2);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px}
</style></head><body>
<header><div class="logo">NFH <em>통합 간호기록</em></div><div class="pat">목업 260621 · 1단계</div></header>
<main>
<div class="hint">💡 ① 왜 오셨는지 <b>여러 개 클릭</b> → ② 각 사정 → ③ 진단 클릭(필요한 만큼) → ④ 평가 📢 → 아래에 <b>[사정-진단-평가] 묶음이 진단 수만큼</b> 쌓여 EMR 복사. <span style="color:var(--pe)">(1단계: 핵심 10모듈 · [칩스확정] 표시)</span></div>
<div class="sec"><div class="sec-h">① 어디가 불편해서 오셨어요? <span style="font-size:12px;color:var(--tx2);font-weight:400">— 여러 개 가능</span></div><div class="cc" id="cc"></div></div>
<div id="mods"></div>
</main>
<div class="sheet"><div class="sh-h">📋 <b>통합 간호기록</b> <span class="c" id="cnt">0줄</span><button onclick="copyNote()">📤 EMR 복사</button></div><div class="sh-b" id="preview"><div class="empty">증상을 선택하세요.</div></div></div>
<script>
/* 진술문 rec = 정본/마스터 원문. ★=[칩스확정](마스터 미존재). 멘트 say=안내(칩스 검증). */
const MODULES={
 통증:{label:'😣 아파', ae:[{q:'"여기가 아프세요?"',rec:'통증 있음'},{q:'"오심·구토?"',rec:'오심, 구토 있음'}], dxs:[{name:'급성통증',cue:0,pe:[{say:'"많이 아프세요? 진통제 필요하실까요?"',rec:'통증을 인정해줌'},{say:'"통증 양상을 확인하겠습니다"',rec:'통증 양상을 확인함'}]}], note:'※ 부위·NRS·6종은 2단계 통증 모듈에서'},
 감염:{label:'🌡️ 열나', ae:[{q:'"열감(몸이 뜨겁다)?"',rec:'열감 있음'},{q:'"오한(chilling)?"',rec:'Chilling 있음'},{q:'CRP 수치 증가?',rec:'C-Reactive protein 수치 증가함'},{q:'체온 상승?',rec:'체온 상승함'}], dxs:[{name:'감염',cue:2,pe:[{say:'"체온을 측정하겠습니다"',rec:'체온 측정함'},{say:'"감염 여부를 확인하겠습니다"',rec:'감염증상이 있는지 확인함'}]},{name:'고체온',cue:3,pe:[{say:'"열을 내리게 미온수로 닦아드릴게요"',rec:'미온수 목욕 시행함'},{say:'"처방받은 해열제 드릴게요"',rec:'처방에 의해 해열제를 투여함'}]}]},
 출혈:{label:'🩸 피나', ae:[{q:'"피가 나는 곳이 있으세요?"',rec:'출혈 있음'},{q:'"어지럼?"',rec:'dizziness 있음'}], dxs:[{name:'출혈',cue:0,pe:[{say:'"출혈이 더 있는지 살펴보겠습니다"',rec:'출혈 증상이 있는지 확인함'},{say:'"출혈 양상(색·양)을 확인하겠습니다"',rec:'출혈 양상 확인함'}]}]},
 호흡:{label:'🫁 숨차', ae:[{q:'"기침?"',rec:'기침 있음'},{q:'"가래 잘 못 뱉음?"',rec:'가래 잘 뱉지 못함'},{q:'"숨이 차거나 답답?"',rec:'호흡곤란 있음'},{q:'"입술·손끝 청색증?"',rec:'입술 청색증 있음'}], dxs:[{name:'비효율적기도청결',cue:1,pe:[{say:'"기침을 크게 해서 가래를 뱉어보세요"',rec:'객담 배출을 격려함'}]},{name:'비효율적호흡양상',cue:2,pe:[{say:'"침대 머리를 올려드릴게요"',rec:'반좌위 취해줌'},{say:'"산소포화도를 확인하겠습니다"',rec:'산소포화도 monitor함'}]},{name:'가스교환장애',cue:3,pe:[{say:'"산소 마스크 착용해 드릴게요"',rec:'산소흡입 시작함'}]}]},
 대사:{label:'🍬 혈당', ae:[{q:'혈당(BST) 증가?',rec:'혈당 증가함'},{q:'혈당(BST) 떨어짐?',rec:'혈당 떨어짐'},{q:'"식은땀·떨림?"',rec:'저혈당 증상 있음'}], dxs:[{name:'고혈당',cue:0,pe:[{say:'"혈당 측정하겠습니다"',rec:'혈당 검사 측정함'},{say:'"처방받은 인슐린 놓아드릴게요"',rec:'처방에 의해 인슐린 투여함'}]},{name:'저혈당',cue:1,pe:[{say:'"혈당 측정하겠습니다"',rec:'혈당 검사 측정함'},{say:'"당(포도당)을 투여해 드릴게요"',rec:'처방에 의해 D50W 을 투여함'}]}]},
 소화기:{label:'🤮 토해·설사', ae:[{q:'"메스껍거나 토하셨어요?"',rec:'오심, 구토 있음'},{q:'"설사?"',rec:'설사 있음'},{q:'탈수 증상?',rec:'탈수 증상 있음'},{q:'"변을 못 보세요?"',rec:'변비 있음'}], dxs:[{name:'체액부족위험',cue:2,pe:[{say:'"탈수 증상이 있는지 살펴보겠습니다"',rec:'탈수 증상이 있는지 확인함'},{say:'"필요하면 잠시 금식하시도록 안내드릴게요"',rec:'금식 하도록 교육함'}]},{name:'변비',cue:3,pe:[{say:'"변비 유발 식품을 피하도록 알려드릴게요"',rec:'변비 유발 식품을 피하도록 교육함'}]}]},
 비뇨기:{label:'🚽 소변', ae:[{q:'"소변 보기 힘드세요?"',rec:'배뇨곤란 있음'},{q:'"막힌 느낌(요정체)?"',rec:'요정체 있음'},{q:'"소변에 피?"',rec:'혈뇨 있음'}], dxs:[{name:'배뇨장애',cue:0,pe:[{say:'"소변이 막혔는지 확인하겠습니다"',rec:'요정체가 있는지 확인함'},{say:'"필요하면 소변줄(도뇨)로 빼드릴게요"',rec:'단순도뇨 시행함'}]}]},
 이비인후:{label:'👂 귀·코·목', ae:[{q:'"귀에서 분비물(고름)?"',rec:'귀분비물 있음'},{q:'"코가 막히세요?"',rec:'코막힘 있음'},{q:'"삼키기 힘드세요?"',rec:'연하곤란 있음'}], dxs:[{name:'감염위험',cue:0,pe:[{say:'"상태를 살펴보겠습니다"',rec:'감염증상이 있는지 확인함'},{say:'"삼키기 편한 음식을 안내드릴게요"',rec:'삼키기 쉬운 음식을 섭취하도록 교육함'}]}]},
 어지럼:{label:'💫 어지러워', ae:[{q:'"어지럽거나 핑 도세요?"',rec:'vertigo 있음'},{q:'"잠깐 정신을 잃으셨어요?"',rec:'syncope 있음'},{q:'Obey command 불가?',rec:'Obey command 가능하지 않음'},{q:'혈당(BST) 측정 — 무조건',rec:'혈당 검사 측정함'}], dxs:[{name:'낙상위험',cue:0,pe:[{say:'"넘어지지 않게 안전하게 부축해 드릴게요"',rec:'안전간호를 제공함'},{say:'"혈당을 확인하겠습니다"',rec:'혈당 검사 측정함'},{say:'"신경학적 증상을 확인하겠습니다"',rec:'신경학적 증상이 있는지 확인함'}]}], note:'★ 어지러우면 신경학+혈당 항상 (칩스 지시)'},
 중독:{label:'💊 약먹음', ae:[{q:'"약물·다른 것을 드셨나요?"',rec:'음독 함 ★'},{q:'"토하셨어요?"',rec:'오심, 구토 있음'},{q:'Obey command 불가?',rec:'Obey command 가능하지 않음'}], dxs:[{name:'중독위험',cue:0,pe:[{say:'"위세척에 대해 설명드릴게요"',rec:'위세척에 대해 설명함'},{say:'"처방받은 해독제를 투여하겠습니다"',rec:'처방에 의해 해독제를 투여함'}]}]},
};
const ORDER=['통증','감염','출혈','호흡','대사','소화기','비뇨기','이비인후','어지럼','중독'];
let picked=[], st={};
const ge=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function renderCC(){ge('cc').innerHTML=ORDER.map(k=>`<div class="ccb ${picked.includes(k)?'on':''}" data-cc="${k}">${MODULES[k].label}</div>`).join('');}
function renderMods(){
 ge('mods').innerHTML=picked.map(k=>{const m=MODULES[k],s=st[k];
  const ae=m.ae.map((it,i)=>`<div class="q"><div class="qp">${esc(it.q)}</div><div class="opts"><div class="opt ${s.ae[i]===true?'pos':''}" data-m="${k}" data-ae="${i}">${s.ae[i]===true?'✓ ':''}${esc(it.rec)}</div><div class="opt ${s.ae[i]===false?'neg':''}" data-m="${k}" data-aeno="${i}">없음</div></div></div>`).join('');
  const dx=m.dxs.map((d,di)=>{const on=s.dx.includes(di),rec=s.ae[d.cue]===true;return `<div class="dxc ${on?'on':''}" data-m="${k}" data-dx="${di}"><div class="ck">${on?'✓':''}</div><b>${esc(d.name)}</b>${rec?'<span class="rec">추천</span>':''}</div>`;}).join('');
  let iv='';s.dx.forEach(di=>{const d=m.dxs[di];iv+=d.pe.map((p,pi)=>`<div class="iv ${s.pe[di+'_'+pi]?'on':''}" data-m="${k}" data-iv="${di}_${pi}"><div><span class="spk">📢</span>${esc(p.say)}</div><div class="r">→ ${esc(p.rec)} ${s.pe[di+'_'+pi]?'✓':''}</div></div>`).join('');});
  return `<div class="mod"><div class="mod-h">${esc(m.label)} 사정</div>${m.note?`<div class="sub" style="color:var(--pe)">${esc(m.note)}</div>`:''}<div class="blk">사정 (A&E)</div>${ae}<div class="blk">간호진단 — 클릭(필요한 만큼)</div>${dx}${s.dx.length?`<div class="blk">평가·중재 (📢)</div>${iv}`:''}</div>`;}).join('');
}
function render(){const L=[];let n=0;
 picked.forEach(k=>{const m=MODULES[k],s=st[k];const anyAE=m.ae.some((it,i)=>s.ae[i]===true);if(!s.dx.length&&!anyAE)return;
  L.push({c:'head',t:`[${esc(m.label)}]`});
  m.ae.forEach((it,i)=>{if(s.ae[i]===true){L.push({c:'ae',tg:'A&E',t:it.rec});n++;}});
  s.dx.forEach(di=>{L.push({c:'d',tg:'D',t:m.dxs[di].name});n++;m.dxs[di].pe.forEach((p,pi)=>{if(s.pe[di+'_'+pi]){L.push({c:'pe',tg:'P&E',t:p.rec});n++;}});});});
 ge('cnt').textContent=n+'줄';
 ge('preview').innerHTML=L.length?L.map(x=>x.c==='head'?`<div class="rl head">${esc(x.t)}</div>`:`<div class="rl ${x.c}"><span class="tg">${x.tg}</span>${esc(x.t)}</div>`).join(''):'<div class="empty">증상을 선택하세요.</div>';
}
ge('cc').addEventListener('click',e=>{const b=e.target.closest('[data-cc]');if(!b)return;const k=b.dataset.cc;
 if(picked.includes(k)){picked=picked.filter(x=>x!==k);delete st[k];}else{picked.push(k);st[k]={ae:{},dx:[],pe:{}};}
 renderCC();renderMods();render();});
ge('mods').addEventListener('click',e=>{const el=e.target.closest('[data-m]');if(!el)return;const k=el.dataset.m,s=st[k];
 if(el.dataset.ae!=null){const i=+el.dataset.ae;s.ae[i]=s.ae[i]===true?undefined:true;}
 else if(el.dataset.aeno!=null){const i=+el.dataset.aeno;s.ae[i]=s.ae[i]===false?undefined:false;}
 else if(el.dataset.dx!=null){const di=+el.dataset.dx;s.dx.includes(di)?s.dx=s.dx.filter(x=>x!==di):s.dx.push(di);}
 else if(el.dataset.iv!=null){s.pe[el.dataset.iv]=!s.pe[el.dataset.iv];}
 renderMods();render();});
function copyNote(){const t=ge('preview').innerText;if(!t||t.includes('증상을 선택')){alert('기록이 비어 있습니다');return;}navigator.clipboard?.writeText(t).then(()=>alert('복사됨! EMR에 붙여넣으세요.')).catch(()=>prompt('복사:',t));}
renderCC();render();
</script></body></html>

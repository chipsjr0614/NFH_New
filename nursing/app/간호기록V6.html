<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFH 통합 간호기록 V6</title>
<style>
:root{
  --ground:#F2F5F5;--surface:#FFF;--surface2:#E8EDEC;--sunk:#EDF1F0;--line:#D3DCDB;--line2:#E3EAE9;
  --ink:#0E1516;--ink2:#495858;--ink3:#7A8A8B;--ink4:#A6B3B3;
  --accent:#0F5F62;--accent-soft:#DEEDEC;--accent-line:#9AC3C1;--on-accent:#FFF;
  --ae:#1F6FD6;--ae-bg:#E8F1FC;--dx:#D63A4D;--dx-bg:#FCEAEC;--pe:#A8730A;--pe-bg:#F9F1DF;
  --ok:#15803D;--ok-bg:#E4F2E8;--warn:#C2410C;--warn-bg:#FCEBE1;
  --shadow:0 1px 2px rgba(15,95,98,.05),0 10px 28px -16px rgba(15,95,98,.22);
  --f1:12px;--f2:14px;--f3:16px;--f4:19px;
}
html[data-t="dark"]{
  --ground:#0B1011;--surface:#141B1C;--surface2:#1C2526;--sunk:#101718;--line:#2A3637;--line2:#212C2D;
  --ink:#E6ECEB;--ink2:#A0AEAE;--ink3:#778788;--ink4:#5A6A6B;
  --accent:#4FB3AE;--accent-soft:#142D2C;--accent-line:#2D5553;--on-accent:#07201F;
  --ae:#78ADEA;--ae-bg:#142230;--dx:#F2808F;--dx-bg:#2D191D;--pe:#DCA940;--pe-bg:#2A2312;
  --ok:#5EBE7F;--ok-bg:#14261B;--warn:#F0965C;--warn-bg:#2E1D14;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:var(--f3);line-height:1.6;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}

/* ── 게이트 ── */
.gate{position:fixed;inset:0;z-index:100;background:var(--ground);display:flex;align-items:center;
  justify-content:center;padding:20px;overflow-y:auto}
.gate.hide{display:none}
.gbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 24px;
  width:100%;max-width:470px;box-shadow:var(--shadow)}
.gbox h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.gbox .s{font-size:var(--f2);color:var(--ink3);margin:0 0 20px}
.fld{display:block;width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:11px;
  padding:14px 15px;font-size:var(--f3);color:var(--ink);margin-bottom:10px;outline:none}
.fld:focus{border-color:var(--accent)}
.fld.ok{border-color:var(--ok);background:var(--ok-bg)}
.chk{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;
  padding:14px 15px;margin-bottom:10px;background:var(--sunk);cursor:pointer;text-align:left;width:100%}
.chk.on{border-color:var(--ok);background:var(--ok-bg)}
.chk .bx{width:25px;height:25px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-weight:800;background:var(--surface);color:transparent}
.chk.on .bx{border-color:var(--ok);background:var(--ok);color:#fff}
.chk .bd{font-size:var(--f3);line-height:1.8;flex:1;min-width:0}
.chk .lb{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--pe);margin-bottom:5px}
.go{display:block;width:100%;text-align:center;border-radius:12px;padding:16px;font-size:17px;
  font-weight:800;margin-top:6px;border:1px solid var(--line);background:var(--surface2);color:var(--ink4)}
.go.on{background:var(--ok);color:#fff;border-color:var(--ok)}

/* ── 헤더 ── */
header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:none}
header .lg{font-weight:800;font-size:14px}.lg em{font-style:normal;color:var(--accent)}
header .pt{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ink2);margin-left:6px}
header .sp{margin-left:auto;display:flex;gap:6px}
header button.ic{border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;
  font-weight:700;color:var(--ink2);background:var(--surface)}
.saved{font-size:11px;color:var(--ink4);font-family:ui-monospace,Menlo,monospace}

/* ── 단계 ── */
.steps{display:flex;align-items:center;padding:10px 14px;background:var(--surface);
  border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.sp{display:flex;align-items:center;gap:7px;flex:none;background:none;padding:0}
.sp .cir{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;background:var(--surface2);color:var(--ink4);border:1.5px solid var(--line);flex:none}
.sp .tx{font-size:var(--f1);font-weight:700;color:var(--ink4);white-space:nowrap}
.sp.done .cir{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.sp.done .tx{color:var(--ink3)}
.sp.now .cir{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sp.now .tx{color:var(--ink);font-weight:800}
.spl{width:20px;height:1.5px;background:var(--line);margin:0 8px;flex:none}
.spl.done{background:var(--accent-line)}

/* ── 2단 ── */
.main{flex:1;display:grid;grid-template-columns:1.5fr 1fr;min-height:0}
.work{overflow-y:auto;padding:20px 22px 26px;border-right:1px solid var(--line);-webkit-overflow-scrolling:touch}
.live{display:flex;flex-direction:column;background:var(--sunk);min-height:0}
.liveh{padding:11px 15px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:11.5px;
  font-weight:800;letter-spacing:.06em;color:var(--ink2);display:flex;gap:8px;align-items:center;flex:none}
.liveh .c{margin-left:auto;font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--ink3)}
.liveb{flex:1;overflow-y:auto;padding:13px 15px;font-family:ui-monospace,SFMono-Regular,Menlo,"D2Coding",monospace;
  font-size:12.5px;line-height:1.85;-webkit-overflow-scrolling:touch}
.rl{display:flex;gap:9px;align-items:baseline}
.rl .tg{font-weight:800;font-size:9.5px;min-width:32px;flex:none;padding-top:2px}
.rl.gh{font-weight:800;color:var(--ink);margin-top:10px;font-size:12px}
.rl.gh:first-child{margin-top:0}
.rl.ae{color:var(--ae)}.rl.dx{color:var(--dx);font-weight:700}.rl.pe{color:var(--pe)}
.rl.note{color:var(--ink3)}.rl.ph{color:var(--ink4)}
.copy{flex:none;padding:11px 15px;border-top:1px solid var(--line);background:var(--surface2)}
.copy button{width:100%;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:12px;
  font-size:var(--f2);font-weight:800}

/* ── 작업영역 ── */
.wt{font-size:var(--f4);font-weight:800;letter-spacing:-.02em;margin:0 0 3px}
.ws{font-size:var(--f2);color:var(--ink3);margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.b{display:inline-flex;align-items:center;justify-content:center;background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;font-size:var(--f2);
  font-weight:700;color:var(--ink2);min-height:48px}
.b.sel{background:var(--surface2);border-color:var(--ink3);color:var(--ink)}
.b.big{padding:17px 20px;font-size:var(--f3)}
.b.dash{border-style:dashed;color:var(--accent)}
.b.wide{flex:1;min-width:150px}
.gl{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--ink3);margin:18px 0 9px;
  display:flex;align-items:center;gap:8px}
.gl::after{content:"";flex:1;height:1px;background:var(--line2)}
.gl .dot{width:8px;height:8px;border-radius:50%;background:var(--ink4);flex:none}
.q{background:var(--surface);border:1.5px solid var(--line2);border-radius:11px;padding:12px 14px;
  margin-bottom:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.q .qt{font-size:var(--f3);font-weight:700;flex:1;min-width:180px;letter-spacing:-.01em}
.q .rec{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink4)}
.ans{display:flex;gap:6px;flex:none;flex-wrap:wrap}
.ab{font-size:var(--f2);font-weight:700;border-radius:8px;padding:10px 16px;border:1.5px solid var(--line);
  background:var(--surface2);color:var(--ink3);min-height:44px}
.ab.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.ab.no{background:var(--surface2);border-color:var(--ink3);color:var(--ink)}
.q.miss{border-style:dashed;border-color:var(--ink4);background:transparent}
.q.miss .qt{color:var(--ink4)}
.mt{font-size:11px;font-weight:800;color:var(--warn);border:1px solid var(--warn);border-radius:5px;padding:3px 8px}
.tin{border:1.5px solid var(--line);background:var(--sunk);border-radius:9px;padding:10px 12px;
  font-size:var(--f2);color:var(--ink);width:90px;outline:none}
.tin:focus{border-color:var(--accent)}
.dxc{border:1.5px solid var(--line);border-left:4px solid var(--dx);border-radius:10px;padding:14px 15px;
  margin-bottom:9px;background:var(--surface);display:flex;align-items:center;gap:11px;width:100%;text-align:left}
.dxc.on{background:var(--dx-bg)}
.dxc .ck{width:22px;height:22px;border-radius:6px;border:2px solid var(--dx);flex:none;display:flex;
  align-items:center;justify-content:center;color:transparent;font-size:12px;font-weight:800}
.dxc.on .ck{background:var(--dx);color:#fff}
.dxc .nm{font-size:var(--f3);font-weight:800;color:var(--dx)}
.dxc .rc{margin-left:auto;font-size:11px;font-weight:800;color:var(--dx);background:var(--dx-bg);
  border:1px solid var(--dx);border-radius:6px;padding:3px 8px;flex:none}
.say{border:1.5px solid var(--line);border-left:4px solid var(--pe);border-radius:10px;padding:13px 15px;
  margin-bottom:8px;background:var(--surface);width:100%;text-align:left}
.say .s{font-size:var(--f3);font-weight:700;letter-spacing:-.01em}
.say .r{font-size:var(--f1);color:var(--pe);margin-top:6px;font-family:ui-monospace,Menlo,monospace}
.say.on{background:var(--pe-bg);border-color:var(--pe)}
.nav{display:flex;gap:9px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line2)}
.nav button{flex:1;text-align:center;border-radius:11px;padding:15px;font-size:var(--f3);font-weight:800;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink2)}
.nav button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent);flex:2}
.nav button:disabled{opacity:.4}
details{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-bottom:12px}
summary{list-style:none;cursor:pointer;padding:12px 15px;font-size:var(--f2);font-weight:800;display:flex;
  align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary .cv{margin-left:auto;color:var(--ink3);font-size:12px}
details[open] summary{border-bottom:1px solid var(--line)}
.refb{padding:14px 15px}
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:9px}
.rc2{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 5px;text-align:center}
.rc2 .n{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:800;margin-top:6px;color:var(--ink2)}
.rc2 .t{font-size:10.5px;color:var(--ink3);line-height:1.4;margin-top:2px}
.warnbar{background:var(--warn-bg);border:1px solid var(--warn);border-radius:9px;padding:10px 13px;
  font-size:var(--f2);margin-bottom:12px}
.warnbar b{color:var(--warn)}
.hint{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:10px;padding:12px 14px;
  font-size:var(--f2);color:var(--ink2);margin-bottom:14px}
textarea.memo{width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;
  padding:11px 13px;font-size:var(--f2);color:var(--ink);min-height:70px;resize:vertical;outline:none;font-family:inherit}
textarea.memo:focus{border-color:var(--accent)}

/* ── 폰 ── */
@media (max-width:820px){
  .main{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .work{border-right:none;padding:16px 15px 22px}
  .live{border-top:1px solid var(--line);max-height:45vh}
  .live.fold .liveb,.live.fold .copy{display:none}
  .liveh{cursor:pointer}
  .sp .tx{display:none}.sp.now .tx{display:inline}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<!-- 게이트 -->

  <p class="s">맞이 시 안전의 첫 단추입니다. 네 가지를 모두 확인해야 시작됩니다.</p>
  <input class="fld" id="pname" placeholder="환자 이름" autocomplete="off">

</div></div>

<header>

  </div>
</div>

/* ══════════ 상태 ══════════ */
let S = blank();
function blank(){
  return {pt:{name:'',id:''}, step:0, cath:{}, cathOpen:false,
          cases:[],            /* {sym,sel1,sel2,set,ans:{},dxOff:[],peOn:{}} */
          closing:null, memo:'',
          consc:null, gcs:{E:null,V:null,M:null}, ori:{}, guard:null, edu:{}};
}
const el = id => document.getElementById(id);
let VIEWS = [];   /* 화면 함수 목록 — 아래에서 채움 */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ══════════ 저장 ══════════ */
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      localStorage.setItem(KEY, JSON.stringify({s:S, at:Date.now()}));
      const d=new Date();
      el('savedAt').textContent='💾 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }catch(e){}
  },400);
}
function restore(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return false;
    const {s,at}=JSON.parse(raw);
    if(!s || !s.pt || !s.pt.name) return false;
    const t=new Date(at), hm=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
    if(!confirm(`이전 기록이 있습니다.\n\n${s.pt.name} · ${s.pt.id}  (${hm} 저장)\n\n이어서 하시겠어요?`)) return false;
    S=Object.assign(blank(), s);
    return true;
  }catch(e){ return false; }
}

/* ══════════ 게이트 ══════════ */
let gConf=false, gEdu=false;
function gval(){
  const ok = gConf && gEdu && el('pname').value.trim() && /^\d{8}$/.test(el('pid').value.trim());
  el('gGo').className='go'+(ok?' on':'');
  el('pname').classList.toggle('ok', !!el('pname').value.trim());
  el('pid').classList.toggle('ok', /^\d{8}$/.test(el('pid').value.trim()));
  return ok;
}
el('cConf').onclick=()=>{gConf=!gConf; el('cConf').classList.toggle('on',gConf); gval();};
el('cEdu').onclick =()=>{gEdu=!gEdu;  el('cEdu').classList.toggle('on',gEdu);  gval();};
['pname','pid'].forEach(i=>el(i).addEventListener('input',gval));
el('gGo').onclick=()=>{
  if(!gval()) return;
  S.pt={name:el('pname').value.trim(), id:el('pid').value.trim()};
  el('gate').classList.add('hide'); render();
};

/* ══════════ 헤더 ══════════ */
el('themeBtn').onclick=()=>{
  const dark=document.documentElement.dataset.t==='dark';
  document.documentElement.dataset.t = dark?'light':'dark';
  el('themeBtn').textContent = dark?'🌙':'☀️';
  try{localStorage.setItem('nfh_v6_theme',document.documentElement.dataset.t)}catch(e){}
};
el('newBtn').onclick=()=>{
  if(!confirm('새 환자로 시작할까요?\n현재 기록은 지워집니다.')) return;
  try{localStorage.removeItem(KEY)}catch(e){}
  location.reload();
};
el('liveh').onclick=()=>{ if(window.innerWidth<=820) el('live').classList.toggle('fold'); };
el('copyBtn').onclick=()=>{
  const t=buildLines().map(x=>x.c==='gh'?`\n[${x.t}]`:`${x.tg}\t${x.t}`).join('\n').trim();
  if(!t){alert('기록이 비어 있습니다.');return;}
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject())
    .then(()=>alert('복사되었습니다.')).catch(()=>prompt('복사하세요:',t));
};

/* ══════════ 헬퍼 ══════════ */
const setOf = s => D.sets[s];
function branchesOf(sym){ return D.branch.filter(b=>b.sym===sym); }
function stmtOf(qid, v){
  const q=D.qbank[qid]; if(!q) return null;
  if(v===undefined||v===null) return null;
  if(q.fmt==='값입력') return String(v).trim()? q.stmts[0]+' '+String(v).trim() : null;
  if(q.fmt==='선택')  return q.stmts[v]||null;
  if(v===true)  return q.stmts[0]||null;
  if(v===false) return q.stmts[1]||null;
  return null;
}
function caseDx(c){ const st=setOf(c.set); return st?st.dx:[]; }
function dxOn(c,name){ return !(c.dxOff||[]).includes(name); }
function recommended(c,dx){ return dx.ae.some(q=>c.ans[q]===true || (D.qbank[q]&&D.qbank[q].fmt!=='토글' && c.ans[q]!==undefined && c.ans[q]!==false)); }

/* ══════════ 기록 생성 ══════════ */
function buildLines(){
  const L=[], push=(c,tg,t)=>L.push({c,tg,t});
  const cs=Object.keys(S.cath).filter(k=>(S.cath[k]||[]).length);
  if(cs.length){ push('gh','','도관');
    cs.forEach(k=>S.cath[k].forEach(d=>push('ae','A&E',d))); }
  S.cases.forEach(c=>{
    const st=setOf(c.set); if(!st) return;
    st.dx.forEach(dx=>{
      if(!dxOn(c,dx.name)) return;
      const aes=dx.ae.map(q=>stmtOf(q,c.ans[q])).filter(Boolean);
      const on=(c.peOn||{})[dx.name]||[];
      const pes=(D.explain[dx.name]&&D.explain[dx.name].length)
        ? D.explain[dx.name].filter(e=>on.includes(e.pe)).map(e=>e.pe)
        : dx.pe.filter(p=>on.includes(p));
      if(!aes.length && !pes.length) return;
      push('gh','',dx.name);
      aes.forEach(t=>push('ae','A&E',t));
      push('dx','D',dx.name);
      pes.forEach(t=>push('pe','P&E',t));
    });
  });
  if(S.closing){
    const cl=D.closing.find(x=>x.sel===S.closing);
    if(cl&&cl.rec){ push('gh','','마무리'); push('ae','A&E',cl.rec); }
  }
  const fae=[];
  if(S.consc==='clear') fae.push('의식 명료함');
  else if(S.consc==='low'){
    const g=S.gcs;
    if(g.E&&g.V&&g.M){ fae.push('Glasgow Coma Scale : '+(g.E+g.V+g.M)); fae.push((g.E+g.V+g.M)===15?'의식 명료함':'의식수준 저하됨'); }
    else fae.push('의식수준 저하됨');
    ORI.forEach(([k,,label])=>{ if(S.ori[k]===0) fae.push(label+' 없음'); else if(S.ori[k]===1) fae.push(label+' 있음'); });
  }
  if(S.guard) fae.push(S.guard);
  const fpe=[];
  Object.keys(S.edu).forEach(i=>{ if(S.edu[i]) (D.edu[i].recs||[]).forEach(r=>{ if(!fpe.includes(r)) fpe.push(r); }); });
  if(fae.length||fpe.length){
    push('gh','','의식 · 낙상');
    fae.forEach(t=>push('ae','A&E',t));
    push('dx','D','낙상위험');
    fpe.forEach(t=>push('pe','P&E',t));
  }
  if(S.memo.trim()) push('note','📌','비고: '+S.memo.trim());
  return L;
}
function renderLive(){
  const L=buildLines();
  const n=L.filter(x=>x.c!=='gh').length;
  let miss=0;
  S.cases.forEach(c=>{ const st=setOf(c.set); if(!st) return;
    new Set(st.dx.flatMap(d=>d.ae)).forEach(q=>{ if(c.ans[q]===undefined) miss++; }); });
  el('cnt').textContent = n+'줄'+(miss?' · 미응답 '+miss:'');
  el('preview').innerHTML = L.length
    ? L.map(x=>x.c==='gh'?`<div class="rl gh">［${esc(x.t)}］</div>`
        :`<div class="rl ${x.c}"><span class="tg">${esc(x.tg)}</span>${esc(x.t)}</div>`).join('')
    : '<div class="rl ph">기록이 여기에 쌓입니다.</div>';
}

/* ══════════ 단계 ══════════ */
function renderSteps(){
  el('steps').innerHTML = STEPS.map((s,i)=>{
    const cls = i<S.step?'done':(i===S.step?'now':'');
    return `<button class="sp ${cls}" data-go="${i}"><span class="cir">${i<S.step?'✓':s.ic}</span><span class="tx">${s.t}</span></button>`
      + (i<STEPS.length-1?`<span class="spl ${i<S.step?'done':''}"></span>`:'');
  }).join('');
}

/* ══════════ 화면 ══════════ */
function render(){
  el('ptInfo').textContent = S.pt.name?`${S.pt.name} · ${S.pt.id}`:'';
  renderSteps();
  el('work').innerHTML = VIEWS[S.step]();
  el('work').scrollTop = 0;
  renderLive(); save();
}
function nav(back,next,disabled){
  return `<div class="nav">
    ${back?`<button data-nav="-1">← 이전</button>`:''}
    <button class="go" data-nav="1" ${disabled?'disabled':''}>${next} →</button></div>`;
}

/* ⓪ 도관 */
function vCath(){
  const list = D.cath.filter(c=>S.cathOpen||c.top);
  const sel = k => (S.cath[k]||[]).length;
  const detail = D.cath.filter(c=>sel(c.s)).map(c=>`
    <div class="gl"><span class="dot"></span>${esc(c.s)}${c.n!==c.s?' · '+esc(c.n):''}</div>
    <div class="row">${c.d.map(d=>`<button class="b ${S.cath[c.s].includes(d)?'sel':''}" data-cd="${esc(c.s)}" data-v="${esc(d)}">${esc(d)}</button>`).join('')}</div>`).join('');
  return `<p class="wt">달고 있는 도관이 있나요?</p>
    <p class="ws">흔한 것부터 나옵니다 · 없으면 바로 다음으로</p>
    <div class="row">${list.map(c=>`<button class="b ${sel(c.s)?'sel':''}" data-ct="${esc(c.s)}">${esc(c.s)}${sel(c.s)?' ✓':''}</button>`).join('')}</div>
    ${S.cathOpen?'':`<div class="row"><button class="b dash" data-more="1">＋ 더보기 ${D.cath.length-list.length}종</button></div>`}
    ${detail}${nav(false,'주호소')}`;
}
/* ① 주호소 */
function vCC(){
  const syms=Object.keys(D.syms);
  const picked = s => S.cases.some(c=>c.sym===s);
  return `<p class="wt">어디가 불편해서 오셨어요?</p>
    <p class="ws">여러 개 고를 수 있습니다</p>
    <div class="row">${syms.map(s=>{
      const y=D.syms[s];
      return `<button class="b big ${picked(s)?'sel':''}" data-sym="${esc(s)}">${esc(y.icon||'')} ${esc(s)}${picked(s)?' ✓':''}</button>`;
    }).join('')}</div>
    ${S.cases.length?`<div class="gl"><span class="dot"></span>고른 주호소 ${S.cases.length}개</div>
      ${S.cases.map((c,i)=>`<div class="q"><span class="qt">${esc(c.sym)}${c.sel1?' · '+esc(c.sel1):''}${c.sel2?' · '+esc(c.sel2):''}</span>
        <button class="ab" data-rm="${i}">빼기</button></div>`).join('')}`:''}
    ${nav(true,'사정', !S.cases.length || S.cases.some(c=>!c.set))}`;
}
/* ② 사정 (분기 + 질문) */
function vAE(){
  const need = S.cases.filter(c=>!c.set);
  if(need.length) return vBranch(need[0]);
  return S.cases.map((c,ci)=>{
    const st=setOf(c.set); if(!st) return '';
    const qs=[...new Set(st.dx.flatMap(d=>d.ae))];
    const core=qs.filter(q=>D.qbank[q].core), rest=qs.filter(q=>!D.qbank[q].core);
    const blk=(list,label,dot)=> list.length?`<div class="gl"><span class="dot" style="background:${dot}"></span>${label}</div>`+list.map(q=>qRow(q,ci)).join(''):'';
    return `<p class="wt">${esc(c.sym)}${c.sel1?' · '+esc(c.sel1):''}${c.sel2?' · '+esc(c.sel2):''}</p>
      <p class="ws">묻고 답을 누르면 그대로 기록됩니다</p>
      ${blk(core,'공통 문진 — 자리가 항상 같습니다','var(--accent)')}
      ${blk(rest,'이 경로에만','var(--pe)')}`;
  }).join('<div style="height:22px"></div>') + nav(true,'진단');
}
function vBranch(c){
  const ci=S.cases.indexOf(c), y=D.syms[c.sym], bs=branchesOf(c.sym);
  if(!c.sel1 && bs.some(b=>b.sel1)){
    const o=[...new Set(bs.map(b=>b.sel1).filter(Boolean))];
    return `<p class="wt">${esc(y.icon||'')} ${esc(c.sym)}</p>
      <p class="ws">💬 ${esc(y.q1||'선택하세요')}</p>
      <div class="row">${o.map(v=>`<button class="b big wide" data-br="${ci}" data-k="1" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  }
  const cand=bs.filter(b=>!c.sel1||b.sel1===c.sel1);
  if(!c.sel2 && cand.some(b=>b.sel2)){
    const o=[...new Set(cand.map(b=>b.sel2).filter(Boolean))];
    return `<p class="wt">${esc(c.sym)} · ${esc(c.sel1)}</p>
      <p class="ws">💬 ${esc(y.q2||'선택하세요')}</p>
      <div class="row">${o.map(v=>`<button class="b big wide" data-br="${ci}" data-k="2" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
  }
  const hit=cand.find(b=>(!b.sel2)||b.sel2===c.sel2)||cand[0];
  if(hit){ c.set=hit.set; return vAE(); }
  return `<p class="wt">경로를 찾을 수 없습니다</p><p class="ws">${esc(c.sym)}</p>${nav(true,'진단')}`;
}
function qRow(qid,ci){
  const q=D.qbank[qid], v=S.cases[ci].ans[qid];
  const label=esc(q.q||'(질문 없음)');
  let ans='';
  if(q.fmt==='값입력'){
    if(q.stmts[0]&&q.stmts[0].indexOf('동공크기')===0){
      return pupilRow(qid,ci);
    }
    ans=`<input class="tin" data-in="${qid}" data-ci="${ci}" value="${esc(v||'')}" placeholder="입력">`;
  }else if(q.fmt==='선택'){
    ans=`<span class="ans">${q.stmts.map((s,i)=>`<button class="ab ${v===i?'on':''}" data-sel="${qid}" data-ci="${ci}" data-i="${i}">${esc(s.length>14?s.slice(0,13)+'…':s)}</button>`).join('')}</span>`;
  }else if(q.stmts.length>=2){
    ans=`<span class="ans"><button class="ab ${v===true?'on':''}" data-yn="${qid}" data-ci="${ci}" data-v="1">있음</button>
      <button class="ab ${v===false?'no':''}" data-yn="${qid}" data-ci="${ci}" data-v="0">없음</button></span>`;
  }else{
    ans=`<span class="ans"><button class="ab ${v===true?'on':''}" data-yn="${qid}" data-ci="${ci}" data-v="1">확인함</button></span>`;
  }
  const miss = v===undefined;
  const short = q.stmts[0]? q.stmts[0].replace(/\s*(있음|없음|함|됨|임)$/,'') : '';
  return `<div class="q ${miss?'miss':''}"><span class="qt">${label}</span>
    ${miss?'<span class="mt">미응답</span>':`<span class="rec">${esc(short.slice(0,20))}</span>`}${ans}</div>`;
}
function pupilRow(qid,ci){
  const v=S.cases[ci].ans[qid]||{};
  const btn=(side)=>[1,2,3,4,5,6,7,8].map(n=>
    `<button class="ab ${v[side]===n?'on':''}" data-pu="${qid}" data-ci="${ci}" data-s="${side}" data-n="${n}">${n}</button>`).join('');
  return `<details><summary>👁️ 동공 크기 참고표<span class="cv">▾</span></summary><div class="refb">
      <div class="warnbar">⚠️ <b>화면 그림은 실제 크기가 아닙니다.</b> 측정은 실물 동공자로 하세요.</div>
      <div class="ref">${PUPIL_REF.map(([n,t])=>`<div class="rc2">
        <svg width="62" height="40" viewBox="0 0 62 40"><ellipse cx="31" cy="20" rx="28" ry="15" fill="none" stroke="var(--ink3)" stroke-width="1.5"/>
        <circle cx="31" cy="20" r="12" fill="var(--ink4)" opacity=".5"/><circle cx="31" cy="20" r="${12*n/11}" fill="var(--ink)"/></svg>
        <div class="n">${n} mm</div><div class="t">${t}</div></div>`).join('')}</div></div></details>
    <div class="q"><span class="qt">🩺 동공 크기 — Rt</span><span class="ans">${btn('rt')}</span></div>
    <div class="q"><span class="qt">🩺 동공 크기 — Lt</span><span class="ans">${btn('lt')}</span></div>`;
}
/* ③ 진단 */
function vDx(){
  return S.cases.map((c,ci)=>{
    const st=setOf(c.set); if(!st) return '';
    return `<p class="wt">${esc(c.sym)} — 간호진단</p>
      <p class="ws">사정 결과로 추천됩니다 · 필요 없으면 끄세요</p>
      ${st.dx.map(dx=>`<button class="dxc ${dxOn(c,dx.name)?'on':''}" data-dx="${ci}" data-n="${esc(dx.name)}">
        <span class="ck">✓</span><span class="nm">${esc(dx.name)}</span>
        ${recommended(c,dx)?'<span class="rc">추천</span>':''}</button>`).join('')}`;
  }).join('<div style="height:20px"></div>') + nav(true,'중재');
}
/* ④ 중재 */
function vPE(){
  return S.cases.map((c,ci)=>{
    const st=setOf(c.set); if(!st) return '';
    return st.dx.filter(dx=>dxOn(c,dx.name)).map(dx=>{
      const ex=D.explain[dx.name]||[];
      const items = ex.length? ex : dx.pe.map(p=>({say:'',pe:p}));
      const on=(c.peOn||{})[dx.name]||[];
      return `<div class="gl"><span class="dot" style="background:var(--dx)"></span>${esc(dx.name)}</div>
        ${items.map(e=>`<button class="say ${on.includes(e.pe)?'on':''}" data-pe="${ci}" data-n="${esc(dx.name)}" data-v="${esc(e.pe)}">
          <div class="s">${e.say?'📢 “'+esc(e.say)+'”':'▸ '+esc(e.pe)}</div>
          ${e.say?`<div class="r">→ ${esc(e.pe)}</div>`:''}</button>`).join('')}`;
    }).join('');
  }).join('') || '<p class="ws">켜진 진단이 없습니다.</p>';
}
function vPEwrap(){ return `<p class="wt">환자에게 이렇게 말해주세요</p>
  <p class="ws">말한 것을 누르면 중재·평가로 기록됩니다</p>${vPE()}${nav(true,'마무리')}`; }
/* ⑤ 마무리 */
function vEnd(){
  const q=(D.closing[0]||{}).q||'그 밖에 더 아프거나 불편한 곳이 있으세요?';
  return `<p class="wt">${esc(q.replace(/^"|"$/g,''))}</p>
    <p class="ws">놓친 것이 없는지 마지막으로 확인합니다</p>
    <div class="row">
      <button class="b big wide ${S.closing==='없음'?'sel':''}" data-cl="없음">없 음</button>
      <button class="b big wide ${S.closing==='있음'?'sel':''}" data-cl="있음">있 음</button></div>
    ${S.closing==='있음'?`<div class="hint">주호소로 돌아가 추가로 사정하거나, 아래 비고에 적어주세요.</div>
      <div class="row"><button class="b" data-go="1">① 주호소로 돌아가기</button></div>`:''}
    <div class="gl"><span class="dot"></span>📌 비고 (자유 기재)</div>
    <textarea class="memo" id="memo" placeholder="횟수·지속시간·부위 등 정형 진술문으로 남길 수 없는 내용">${esc(S.memo)}</textarea>
    ${nav(true,'의식·낙상')}`;
}
/* ⑥ 의식·낙상 */
function vFix(){
  const g=S.gcs, sum=(g.E&&g.V&&g.M)?(g.E+g.V+g.M):null;
  return `<p class="wt">의식 · 보호자 · 낙상</p>
    <p class="ws">모든 환자에게 확인합니다</p>
    <div class="gl"><span class="dot"></span>의식</div>
    <div class="row">
      <button class="b big wide ${S.consc==='clear'?'sel':''}" data-cs="clear">GCS 15 · 명료</button>
      <button class="b big wide ${S.consc==='low'?'sel':''}" data-cs="low">명료하지 않음</button></div>
    ${S.consc==='low'?`
      <div class="gl"><span class="dot"></span>GCS ${sum?'· 합계 '+sum:''}</div>
      ${[['E','눈뜸',GE],['V','언어',GV],['M','운동',GM]].map(([k,lb,arr])=>
        `<div class="q"><span class="qt" style="min-width:70px;flex:0 0 auto">${lb} ${k}</span><span class="ans">
        ${arr.map(([t,n])=>`<button class="ab ${g[k]===n?'on':''}" data-g="${k}" data-n="${n}">${t}</button>`).join('')}</span></div>`).join('')}
      <div class="gl"><span class="dot"></span>지남력</div>
      ${ORI.map(([k,lb])=>`<div class="q"><span class="qt" style="min-width:70px;flex:0 0 auto">${lb}</span><span class="ans">
        <button class="ab ${S.ori[k]===1?'on':''}" data-or="${k}" data-v="1">있음</button>
        <button class="ab ${S.ori[k]===0?'no':''}" data-or="${k}" data-v="0">없음</button></span></div>`).join('')}`:''}
    <div class="gl"><span class="dot"></span>보호자</div>
    <div class="row">
      <button class="b big wide ${S.guard==='보호자 환자 옆에 상주하고 있음'?'sel':''}" data-gd="보호자 환자 옆에 상주하고 있음">상주</button>
      <button class="b big wide ${S.guard==='보호자 동행하지 않음'?'sel':''}" data-gd="보호자 동행하지 않음">없음</button></div>
    <div class="gl"><span class="dot" style="background:var(--pe)"></span>낙상 교육 · 말하면 기록됩니다</div>
    ${D.edu.map((e,i)=>`<button class="say ${S.edu[i]?'on':''}" data-edu="${i}">
      <div class="s">📢 “${esc((e.say||'').replace(/^"|"$/g,''))}”</div>
      <div class="r">→ ${esc((e.recs||[]).join(' / '))}</div></button>`).join('')}
    <div class="nav"><button data-nav="-1">← 이전</button>
      <button class="go" id="doneBtn">📤 EMR 복사</button></div>`;
}

/* ══════════ 이벤트 ══════════ */
el('work').addEventListener('click', e=>{
  const t = e.target.closest('[data-ct],[data-cd],[data-more],[data-sym],[data-rm],[data-br],[data-yn],[data-sel],[data-pu],[data-dx],[data-pe],[data-cl],[data-cs],[data-g],[data-or],[data-gd],[data-edu],[data-nav],[data-go]');
  if(!t) return;
  const d=t.dataset;
  if(d.more){ S.cathOpen=true; }
  else if(d.ct){ if(S.cath[d.ct]) delete S.cath[d.ct]; else S.cath[d.ct]=[]; }
  else if(d.cd){ const a=S.cath[d.cd]||(S.cath[d.cd]=[]); const i=a.indexOf(d.v); i<0?a.push(d.v):a.splice(i,1); }
  else if(d.sym){
    const i=S.cases.findIndex(c=>c.sym===d.sym);
    if(i>=0) S.cases.splice(i,1);
    else S.cases.push({sym:d.sym, sel1:'', sel2:'', set:'', ans:{}, dxOff:[], peOn:{}});
  }
  else if(d.rm!=null){ S.cases.splice(+d.rm,1); }
  else if(d.br!=null){ const c=S.cases[+d.br]; if(d.k==='1'){c.sel1=d.v;c.sel2='';} else c.sel2=d.v; }
  else if(d.yn){ const c=S.cases[+d.ci], v=d.v==='1'; c.ans[d.yn] = c.ans[d.yn]===v ? undefined : v; }
  else if(d.sel){ const c=S.cases[+d.ci], i=+d.i; c.ans[d.sel] = c.ans[d.sel]===i ? undefined : i; }
  else if(d.pu){ const c=S.cases[+d.ci]; const o=Object.assign({}, c.ans[d.pu]||{});
    o[d.s] = o[d.s]===+d.n ? undefined : +d.n;
    c.ans[d.pu] = (o.rt||o.lt) ? ['Rt '+(o.rt||'__'),'Lt '+(o.lt||'__')].join(' / ') : undefined;
    c.ans['_'+d.pu]=o; }
  else if(d.dx!=null){ const c=S.cases[+d.dx]; c.dxOff=c.dxOff||[];
    const i=c.dxOff.indexOf(d.n); i<0?c.dxOff.push(d.n):c.dxOff.splice(i,1); }
  else if(d.pe!=null){ const c=S.cases[+d.pe]; c.peOn=c.peOn||{};
    const a=c.peOn[d.n]||(c.peOn[d.n]=[]); const i=a.indexOf(d.v); i<0?a.push(d.v):a.splice(i,1); }
  else if(d.cl){ S.closing = S.closing===d.cl?null:d.cl; }
  else if(d.cs){ S.consc = S.consc===d.cs?null:d.cs; }
  else if(d.g){ S.gcs[d.g] = S.gcs[d.g]===+d.n?null:+d.n; }
  else if(d.or){ S.ori[d.or] = S.ori[d.or]===+d.v?undefined:+d.v; }
  else if(d.gd){ S.guard = S.guard===d.gd?null:d.gd; }
  else if(d.edu!=null){ S.edu[d.edu]=!S.edu[d.edu]; }
  else if(d.nav){ S.step=Math.max(0,Math.min(STEPS.length-1,S.step+ +d.nav)); }
  else if(d.go!=null){ S.step=+d.go; }
  render();
});
el('steps').addEventListener('click', e=>{
  const t=e.target.closest('[data-go]'); if(!t) return;
  S.step=+t.dataset.go; render();
});
el('work').addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='memo'){ S.memo=t.value; renderLive(); save(); return; }
  if(t.dataset.in){ const c=S.cases[+t.dataset.ci]; c.ans[t.dataset.in]=t.value; renderLive(); save(); }
});
document.addEventListener('click', e=>{ if(e.target.id==='doneBtn') el('copyBtn').click(); });

/* ══════════ 시작 ══════════ */
VIEWS = [vCath, vCC, vAE, vDx, vPEwrap, vEnd, vFix];
try{ const th=localStorage.getItem('nfh_v6_theme'); if(th){document.documentElement.dataset.t=th; el('themeBtn').textContent = th==='dark'?'☀️':'🌙';} }catch(e){}
if(restore()){ el('gate').classList.add('hide'); render(); }
else { el('pname').focus(); }
</script>
</body></html>

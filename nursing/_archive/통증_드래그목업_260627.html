<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>간호기록 드래그 목업 (통증)</title>
<style>
:root{--bg:#0a0e14;--panel:#12181f;--card:#1a212b;--card2:#222b38;--line:#2a3441;--tx:#e6edf3;--tx2:#8b97a7;--pos:#ff4d5e;--ok:#2ecc71;--ae:#4aa8ff;--d:#ff6b6b;--pe:#ffc857;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:13px 18px;font-weight:800;font-size:17px}
header em{color:var(--ok);font-style:normal}
main{max-width:760px;margin:0 auto;padding:16px 18px}
.sec-h{font-size:16px;font-weight:800;margin:6px 2px 12px}
.blk{font-size:13px;color:var(--tx2);font-weight:700;margin:16px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.btn{background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:16px 6px;cursor:pointer;font-size:15px;color:var(--tx2);text-align:center;font-weight:700}.btn.on{background:var(--pos);border-color:var(--pos);color:#fff}
.opts{display:flex;gap:8px}.opt{flex:1;text-align:center;padding:14px;border-radius:11px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx2);font-size:16px;font-weight:600;cursor:pointer}.opt.pos{background:var(--pos);border-color:var(--pos);color:#fff}.opt.neg{background:#2a3038;border-color:#5a6878;color:var(--tx)}
.ints{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}.ib{padding:13px 0;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--tx2);font-size:15px;font-weight:700;cursor:pointer;text-align:center}.ib.on{background:var(--pe);color:#1a1a1a;border-color:var(--pe)}
.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.fb{padding:11px 2px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer;text-align:center}.fb.on{border-color:var(--pe);background:rgba(255,200,87,.15)}.fb .fe{font-size:32px;line-height:1.1}.fb .fn{font-size:13px;color:var(--tx2);margin-top:3px}.fb.on .fn{color:var(--pe);font-weight:700}
.hint{font-size:13px;color:var(--tx2);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:11px 13px;margin-bottom:14px}

/* ===== 드래그로 크기 조절되는 하단 간호기록 ===== */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:2px solid var(--line);height:260px;display:flex;flex-direction:column;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.handle{height:26px;display:flex;align-items:center;justify-content:center;cursor:ns-resize;border-bottom:1px solid var(--line);touch-action:none;user-select:none;color:var(--tx2);font-size:12px;font-weight:700;gap:8px;background:var(--card)}
.handle .bar{width:46px;height:5px;border-radius:3px;background:var(--line)}
.sh-h{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line)}.sh-h b{font-size:16px}.sh-h .c{font-size:13px;color:var(--tx2)}.sh-h button{margin-left:auto;background:var(--ok);color:#063;border:none;border-radius:9px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
.sh-b{overflow-y:auto;padding:14px 20px;max-width:760px;margin:0 auto;width:100%;font-size:17px;line-height:1.75}.rl{margin:3px 0}.rl .tg{font-weight:800;font-size:12px;margin-right:8px;display:inline-block;min-width:36px}.rl.ae{color:var(--ae)}.rl.d{color:var(--d);font-weight:700}.rl.pe{color:var(--pe)}.rl.note{color:var(--tx2);font-size:15px}.rl.head{color:var(--tx);font-weight:800;margin-top:10px;font-size:17px}.empty{color:var(--tx2);font-size:15px}
</style></head><body>
<header>NFH <em>간호기록</em> — 드래그 목업 (통증)</header>
<main id="main">
<div class="hint">💡 아래 <b>간호기록 칸의 손잡이(⬍)를 위·아래로 드래그</b>하면 칸이 커지고 작아집니다. 사정하면 실시간으로 기록이 쌓여요.</div>
<div class="sec-h">😣 통증 — 어디가 아프세요?</div>
<div class="grid" id="parts"></div>
<div id="painUI"></div>
</main>

<div class="sheet" id="sheet">
 <div class="handle" id="handle"><span class="bar"></span>⬍ 드래그해서 간호기록 크게/작게<span class="bar"></span></div>
 <div class="sh-h">📋 <b>간호기록</b> <span class="c" id="cnt">0줄</span><button onclick="copyNote()">📤 EMR 복사</button></div>
 <div class="sh-b" id="preview"><div class="empty">부위를 선택해 사정을 시작하세요.</div></div>
</div>

<script>
const ge=id=>document.getElementById(id);
const PARTS=[['head','🧠 머리'],['chest','🫀 가슴'],['abdo','🫃 배'],['arm','💪 팔'],['leg','🦵 다리']];
const FACES=[['😀',0],['🙂',2],['😐',4],['😣',6],['😫',8],['😭',10]]; /* Wong-Baker FPRS */
let st={part:null,partLabel:'',pain:null,intensity:null};

ge('parts').innerHTML=PARTS.map(([k,l])=>`<div class="btn" data-p="${k}" data-l="${l}">${l}</div>`).join('');
ge('parts').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;
 if(st.part===b.dataset.p){st={part:null,partLabel:'',pain:null,intensity:null};}else{st={part:b.dataset.p,partLabel:b.dataset.l,pain:null,intensity:null};}
 renderParts();renderPainUI();render();};
function renderParts(){[...ge('parts').children].forEach(c=>c.classList.toggle('on',c.dataset.p===st.part));}
function renderPainUI(){
 if(!st.part){ge('painUI').innerHTML='';return;}
 let h=`<div class="blk">"${st.partLabel.replace(/^\S+\s/,'')}에 통증이 있으세요?"</div><div class="opts"><div class="opt ${st.pain===true?'pos':''}" data-pain="1">있음</div><div class="opt ${st.pain===false?'neg':''}" data-pain="0">없음</div></div>`;
 if(st.pain===true){
  h+=`<div class="blk">😀 표정 통증척도 (Faces · FPRS)</div><div class="faces">${FACES.map(([f,v])=>`<div class="fb ${st.intensity===v?'on':''}" data-int="${v}"><div class="fe">${f}</div><div class="fn">${v}</div></div>`).join('')}</div>`;
  h+=`<div class="blk">🔢 통증 강도 (0~10 · NRS)</div><div class="ints">${Array.from({length:11},(_,n)=>`<div class="ib ${st.intensity===n?'on':''}" data-int="${n}">${n}</div>`).join('')}</div>`;
 }
 ge('painUI').innerHTML=h;
}
ge('painUI').onclick=e=>{const p=e.target.closest('[data-pain]');if(p){st.pain=p.dataset.pain==='1';if(!st.pain)st.intensity=null;renderPainUI();render();return;}
 const i=e.target.closest('[data-int]');if(i){st.intensity=+i.dataset.int;renderPainUI();render();}};
function render(){const L=[];
 if(st.part&&st.pain!==null){
  L.push({c:'head',t:`[통증 · ${st.partLabel.replace(/^\S+\s/,'')}]`});
  L.push({c:'ae',tg:'A&E',t:st.pain?'통증 있음':'통증 없음'});
  if(st.pain){if(st.intensity!=null)L.push({c:'note',tg:'📌',t:'비고: 통증강도 '+st.intensity+'점'});
   L.push({c:'d',tg:'D',t:'급성통증'});
   L.push({c:'pe',tg:'P&E',t:'통증 양상을 확인함'});}}
 ge('cnt').textContent=L.filter(x=>x.c!=='head').length+'줄';
 ge('preview').innerHTML=L.length?L.map(x=>x.c==='head'?`<div class="rl head">${x.t}</div>`:`<div class="rl ${x.c}"><span class="tg">${x.tg||''}</span>${x.t}</div>`).join(''):'<div class="empty">부위를 선택해 사정을 시작하세요.</div>';
}
function copyNote(){const t=ge('preview').innerText;if(!t||t.includes('시작하세요')){alert('비어 있음');return;}navigator.clipboard?.writeText(t).then(()=>alert('복사됨!')).catch(()=>prompt('복사:',t));}

/* ===== 드래그 리사이즈 (마우스 + 터치 통합) ===== */
const sheet=ge('sheet'),handle=ge('handle');
let drag=false,startY=0,startH=0;
function setH(h){const min=70,max=window.innerHeight*0.85;h=Math.max(min,Math.min(max,h));sheet.style.height=h+'px';ge('main').style.paddingBottom=(h+24)+'px';}
handle.addEventListener('pointerdown',e=>{drag=true;startY=e.clientY;startH=sheet.offsetHeight;handle.setPointerCapture(e.pointerId);e.preventDefault();});
handle.addEventListener('pointermove',e=>{if(!drag)return;setH(startH+(startY-e.clientY));});
handle.addEventListener('pointerup',()=>{drag=false;});
handle.addEventListener('pointercancel',()=>{drag=false;});
setH(260);
render();
</script></body></html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>호흡곤란 사정 시각화 (임시)</title>
<style>
:root{--bg:#0a0e14;--panel:#12181f;--card:#1a212b;--card2:#222b38;--line:#2a3441;--tx:#e6edf3;--tx2:#8b97a7;--pos:#ff4d5e;--ok:#2ecc71;--ae:#4aa8ff;--d:#ff6b6b;--pe:#ffc857;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:250px;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:10px}
header .logo{font-weight:800;font-size:16px}.logo em{color:var(--ae);font-style:normal}
header .pat{font-size:12px;color:var(--tx2);margin-left:auto}
main{max-width:520px;margin:0 auto;padding:14px}
.sec{margin-bottom:18px}
.sec-h{font-size:14px;font-weight:800;margin:4px 2px 10px;display:flex;align-items:center;gap:7px}
.sub{font-size:12px;color:var(--tx2);margin:-4px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}
.q{margin-bottom:10px}
.q .qp{font-size:14px;font-weight:600;margin-bottom:7px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{flex:1;min-width:64px;text-align:center;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer}
.opt.neg{border-color:#5a6878;color:var(--tx);background:#2a3038}
.opt.pos{border-color:var(--pos);color:#fff;background:var(--pos)}
.tag{font-size:10px;color:var(--ae);border:1px solid var(--ae);border-radius:5px;padding:1px 5px;margin-left:6px}
.dx{display:flex;align-items:center;gap:11px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:13px;margin-bottom:8px;cursor:pointer}
.dx .rd{width:20px;height:20px;border:2px solid var(--tx2);border-radius:50%;flex:none;position:relative}
.dx.on{border-color:var(--d);background:rgba(255,107,107,.08)}
.dx.on .rd{border-color:var(--d)}.dx.on .rd::after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--d)}
.dx b{font-size:15px}
.dx .rec{margin-left:auto;font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:5px;padding:2px 7px}
.dx .cue{font-size:11px;color:var(--tx2);display:block;margin-top:2px}
/* 평가 멘트 */
.iv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:7px;cursor:pointer}
.iv.on{border-color:var(--pe);background:rgba(255,200,87,.08)}
.iv .s{font-size:14px}.iv .s .spk{color:var(--pe);font-weight:800;margin-right:5px}
.iv .r{font-size:12px;color:var(--tx2);margin-top:6px}.iv.on .r{color:var(--pe);font-weight:600}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:2px solid var(--line);max-height:240px;display:flex;flex-direction:column}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sh-h b{font-size:14px}.sh-h .c{font-size:12px;color:var(--tx2)}
.sh-h button{margin-left:auto;background:var(--ok);color:#063;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.sh-b{overflow-y:auto;padding:10px 16px;max-width:520px;margin:0 auto;width:100%;font-size:13.5px;line-height:1.6}
.rl{margin:1px 0}.rl .tg{font-weight:800;font-size:10px;margin-right:6px;display:inline-block;min-width:26px}
.rl.ae{color:var(--ae)}.rl.d{color:var(--d)}.rl.pe{color:var(--pe)}.rl.head{color:var(--tx);font-weight:800}
.empty{color:var(--tx2);font-size:13px}
.hint{font-size:12px;color:var(--tx2);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px}
</style>
</head>
<body>
<header><div class="logo">NFH <em>호흡곤란 사정</em></div><div class="pat">임시 시각화 260621 v2</div></header>
<main>
  <div class="hint">💡 호흡 사정은 <b>다 체크</b>, 진단은 <b>1개 선택</b> → 평가에 <b>📢 간호사 멘트</b>가 뜨고, 탭하면 P&amp;E가 기록됩니다. <span style="color:var(--pe)">※ 멘트는 안내 초안 — 칩스 검증 필요.</span></div>

  <div class="sec">
    <div class="sec-h">① 호흡 사정 <span style="font-size:12px;color:var(--tx2);font-weight:400">— 해당하는 것 모두</span></div>
    <div class="card" id="assess"></div>
  </div>
  <div class="sec">
    <div class="sec-h">🩺 ② 간호진단 <span style="font-size:12px;color:var(--tx2);font-weight:400">— 1개만 선택</span></div>
    <div class="sub">사정 단서에 따라 <b>추천</b>이 뜹니다. 그 중 하나를 고르세요.</div>
    <div id="dxlist"></div>
  </div>
  <div class="sec" id="ivsec" style="display:none">
    <div class="sec-h">💬 ③ 평가 · 중재 <span style="font-size:12px;color:var(--tx2);font-weight:400">— 📢 말하고 탭하면 기록</span></div>
    <div id="ivlist"></div>
  </div>
</main>
<div class="sheet">
  <div class="sh-h">📋 <b>간호기록 미리보기</b> <span class="c" id="cnt">0줄</span><button onclick="copyNote()">📤 복사</button></div>
  <div class="sh-b" id="preview"><div class="empty">사정을 시작하세요.</div></div>
</div>
<script>
const ASSESS=[
  {q:'"기침이 있으세요?"', kind:'toggle', opts:[{l:'있음',rec:'기침 있음',pos:true},{l:'없음',rec:'기침 없음'}]},
  {q:'"가래가 나오나요?"', kind:'toggle', opts:[{l:'있음',rec:'가래 있음',pos:true},{l:'없음',rec:'가래 없음'}]},
  {q:'가래 소리 청진', kind:'check', rec:'가래 소리 들림', cue:'기도청결'},
  {q:'"가래를 잘 못 뱉으세요?"', kind:'check', rec:'가래 잘 뱉지 못함', cue:'기도청결'},
  {q:'"쌕쌕거리는 숨소리(천명)?"', kind:'toggle', opts:[{l:'있음',rec:'Wheezing 있음',pos:true,cue:'호흡양상'},{l:'없음',rec:'Wheezing 없음'}]},
  {q:'"숨이 차거나 답답?"', kind:'toggle', opts:[{l:'있음',rec:'호흡곤란 있음',pos:true,cue:'호흡양상'},{l:'없음',rec:'호흡곤란 없음'}]},
  {q:'호흡수 측정', kind:'check', rec:'호흡수 증가함', cue:'호흡양상'},
  {q:'입술 색 확인', kind:'toggle', opts:[{l:'청색증',rec:'입술 청색증 있음',pos:true,cue:'가스교환'},{l:'정상',rec:'입술 청색증 없음'}]},
  {q:'말단(손끝) 색 확인', kind:'toggle', opts:[{l:'청색증',rec:'말단 청색증 있음',pos:true,cue:'가스교환'},{l:'정상',rec:'말단 청색증 없음'}]},
  {q:'"어지럼?"', kind:'toggle', opts:[{l:'있음',rec:'dizziness 있음',pos:true,cue:'가스교환'},{l:'없음',rec:'dizziness 없음'}]},
  {q:'"열감?"', kind:'toggle', opts:[{l:'있음',rec:'열감 있음',pos:true},{l:'없음',rec:'열감 없음'}]},
  {q:'"오한(chilling)?"', kind:'toggle', opts:[{l:'있음',rec:'chilling 있음',pos:true},{l:'없음',rec:'chilling 없음'}]},
  {q:'산소포화도 확인', kind:'check', rec:'산소흡입 중임'},
];
const DXS=[
  {key:'기도청결', name:'비효율적기도청결', cueTxt:'가래 소리·가래 못 뱉음', pe:[
    {say:'"기침을 크게 해서 가래를 뱉어보세요"', rec:'객담 배출을 격려함'},
    {say:'"가래가 잘 나오게 자세를 바꿔드릴게요"', rec:'체위배액 시행함'},
    {say:'"흡입 치료(네뷸라이저) 해드릴게요"', rec:'nebulizer 적용함'}]},
  {key:'호흡양상', name:'비효율적호흡양상', cueTxt:'호흡곤란·호흡수 증가·천명', pe:[
    {say:'"숨쉬기 편하게 침대 머리를 올려드릴게요"', rec:'반좌위 취해줌'},
    {say:'"천천히 깊게 숨을 들이쉬고 내쉬어 보세요"', rec:'심호흡을 하게 함'},
    {say:'"숨이 더 차면 바로 말씀해 주세요"', rec:'호흡곤란이 있는지 확인함'}]},
  {key:'가스교환', name:'가스교환장애', cueTxt:'청색증·어지럼', pe:[
    {say:'"산소 마스크 착용해 드릴게요"', rec:'산소흡입 시작함'},
    {say:'"산소 수치를 계속 확인해 드릴게요"', rec:'산소포화도 monitor함'}]},
];
let state={ae:{}, dx:null, pe:{}};
const ge=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function cues(){ const s=new Set(); ASSESS.forEach((it,i)=>{ if(it.kind==='check'&&state.ae[i]===true&&it.cue)s.add(it.cue); if(it.kind==='toggle'){const oi=state.ae[i]; if(oi!=null&&it.opts[oi].cue)s.add(it.opts[oi].cue);} }); return s; }
function renderAssess(){
  ge('assess').innerHTML=ASSESS.map((it,i)=>{
    const head=`<div class="qp">${esc(it.q)}</div>`;
    if(it.kind==='check'){const on=state.ae[i]===true; return `<div class="q">${head}<div class="opts"><div class="opt ${on?'pos':''}" data-a="${i}" data-k="check" style="flex:0 0 auto;min-width:150px">${on?'✓ ':''}${esc(it.rec)}${it.cue?`<span class="tag">${it.cue}</span>`:''}</div></div></div>`;}
    return `<div class="q">${head}<div class="opts">${it.opts.map((o,oi)=>{const sel=state.ae[i]===oi,cls=sel?(o.pos?'pos':'neg'):'';return `<div class="opt ${cls}" data-a="${i}" data-k="toggle" data-oi="${oi}">${esc(o.l)}${o.cue&&sel?`<span class="tag">${o.cue}</span>`:''}</div>`;}).join('')}</div></div>`;
  }).join('');
}
function renderDx(){
  const rec=cues();
  ge('dxlist').innerHTML=DXS.map(d=>{const on=state.dx===d.key,isRec=rec.has(d.key);
    return `<div class="dx ${on?'on':''}" data-dx="${d.key}"><div class="rd"></div><div><b>${d.name}</b><span class="cue">단서: ${d.cueTxt}</span></div>${isRec?'<span class="rec">추천</span>':''}</div>`;}).join('');
  const d=DXS.find(x=>x.key===state.dx);
  if(d){ ge('ivsec').style.display='block';
    ge('ivlist').innerHTML=d.pe.map((p,i)=>`<div class="iv ${state.pe[i]?'on':''}" data-iv="${i}"><div class="s"><span class="spk">📢</span>${esc(p.say)}</div><div class="r">→ ${esc(p.rec)} ${state.pe[i]?'✓ 기록됨':''}</div></div>`).join('');
  } else ge('ivsec').style.display='none';
}
function render(){
  const L=[{c:'head',t:'[호흡곤란]'}];
  ASSESS.forEach((it,i)=>{const v=state.ae[i];
    if(it.kind==='check'&&v===true) L.push({c:'ae',tg:'A&E',t:it.rec});
    if(it.kind==='toggle'&&v!=null) L.push({c:'ae',tg:'A&E',t:it.opts[v].rec});
  });
  const d=DXS.find(x=>x.key===state.dx);
  if(d){ L.push({c:'d',tg:'D',t:d.name}); d.pe.forEach((p,i)=>{if(state.pe[i])L.push({c:'pe',tg:'P&E',t:p.rec});}); }
  const rec=L.filter(x=>x.c!=='head'); ge('cnt').textContent=rec.length+'줄';
  ge('preview').innerHTML = rec.length? L.map(x=>x.c==='head'?`<div class="rl head">${esc(x.t)}</div>`:`<div class="rl ${x.c}"><span class="tg">${x.tg}</span>${esc(x.t)}</div>`).join('') : '<div class="empty">사정을 시작하세요.</div>';
}
ge('assess').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const i=+el.dataset.a;
  if(el.dataset.k==='check') state.ae[i]=state.ae[i]===true?undefined:true;
  else {const oi=+el.dataset.oi; state.ae[i]=state.ae[i]===oi?undefined:oi;}
  renderAssess();renderDx();render();});
ge('dxlist').addEventListener('click',e=>{const el=e.target.closest('[data-dx]');if(!el)return;
  state.dx=state.dx===el.dataset.dx?null:el.dataset.dx; state.pe={}; renderDx();render();});
ge('ivlist').addEventListener('click',e=>{const el=e.target.closest('[data-iv]');if(!el)return;const i=+el.dataset.iv;state.pe[i]=!state.pe[i];renderDx();render();});
function copyNote(){alert('복사 데모');}
renderAssess();renderDx();render();
</script>
</body>
</html>

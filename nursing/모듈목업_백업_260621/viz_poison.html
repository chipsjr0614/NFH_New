<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중독·음독 사정 시각화 (임시)</title>
<style>
:root{--bg:#0a0e14;--panel:#12181f;--card:#1a212b;--card2:#222b38;--line:#2a3441;--tx:#e6edf3;--tx2:#8b97a7;--pos:#ff4d5e;--ok:#2ecc71;--ae:#4aa8ff;--d:#ff6b6b;--pe:#ffc857;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;word-break:keep-all}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:250px;font-size:16px;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:10px}
header .logo{font-weight:800;font-size:16px}.logo em{color:#a3e635;font-style:normal}
header .pat{font-size:12px;color:var(--tx2);margin-left:auto}
main{max-width:520px;margin:0 auto;padding:14px}
.sec{margin-bottom:18px}.sec-h{font-size:14px;font-weight:800;margin:4px 2px 10px;display:flex;align-items:center;gap:7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.tp{background:var(--card2);border:1.5px solid var(--line);border-radius:11px;padding:13px 6px;cursor:pointer;font-size:13.5px;color:var(--tx2);text-align:center;font-weight:600}
.tp.on{background:#a3e635;border-color:#a3e635;color:#1a2400}
.q{margin-bottom:10px}.q .qp{font-size:14px;font-weight:600;margin-bottom:7px}.q .nt{font-size:11px;color:var(--tx2);font-weight:400;margin-left:6px}
.blk-t{font-size:12px;color:var(--tx2);font-weight:700;margin:6px 2px 7px}
.opts{display:flex;gap:7px;flex-wrap:wrap}
.opt{flex:1;min-width:56px;text-align:center;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--card2);color:var(--tx2);font-size:14px;font-weight:600;cursor:pointer}
.opt.neg{border-color:#5a6878;color:var(--tx);background:#2a3038}.opt.pos{border-color:var(--pos);color:#fff;background:var(--pos)}
.vin{width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--tx);font-size:14px;outline:none}
.dx{display:flex;align-items:center;gap:11px;background:rgba(255,107,107,.08);border:1.5px solid var(--d);border-radius:12px;padding:13px}
.dx b{font-size:15px}.dx .auto{margin-left:auto;font-size:10px;color:var(--d);border:1px solid var(--d);border-radius:5px;padding:2px 7px}
.iv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:7px;cursor:pointer}.iv.on{border-color:var(--pe);background:rgba(255,200,87,.08)}
.iv .s{font-size:14px}.iv .s .spk{color:var(--pe);font-weight:800;margin-right:5px}.iv .r{font-size:12px;color:var(--tx2);margin-top:6px}.iv.on .r{color:var(--pe);font-weight:600}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--panel);border-top:2px solid var(--line);max-height:240px;display:flex;flex-direction:column}
.sh-h{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}.sh-h b{font-size:14px}.sh-h .c{font-size:12px;color:var(--tx2)}
.sh-h button{margin-left:auto;background:var(--ok);color:#063;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}
.sh-b{overflow-y:auto;padding:10px 16px;max-width:520px;margin:0 auto;width:100%;font-size:13.5px;line-height:1.6}
.rl{margin:1px 0}.rl .tg{font-weight:800;font-size:10px;margin-right:6px;display:inline-block;min-width:26px}
.rl.ae{color:var(--ae)}.rl.d{color:var(--d)}.rl.pe{color:var(--pe)}.rl.head{color:var(--tx);font-weight:800}.rl.note{color:var(--tx2);font-size:12.5px}
.empty{color:var(--tx2);font-size:13px}
.hint{font-size:12px;color:var(--tx2);background:var(--card);border:1px dashed var(--line);border-radius:9px;padding:9px 11px;margin-bottom:12px}
.hide{display:none}
</style>
</head>
<body>
<header><div class="logo">NFH <em>중독·음독 사정</em></div><div class="pat">임시 시각화 260621</div></header>
<main>
  <div class="hint">💡 유형 선택 → <b>신경계 사정(동공·빛반사·obey command·지남력) 항상 포함</b> → 진단 자동 → 평가 📢. <span style="color:var(--pe)">음독 함=[칩스확정] · 멘트 초안 — 칩스 검증.</span></div>
  <div class="sec"><div class="sec-h">① 유형 <span style="font-size:12px;color:var(--tx2);font-weight:400">— 하나 선택</span></div><div class="types" id="types"></div></div>
  <div id="body" class="hide">
    <div class="sec"><div class="sec-h">② 사정 (신경계 포함)</div><div class="card" id="assess"></div></div>
    <div class="sec"><div class="sec-h">🩺 ③ 간호진단 <span style="font-size:12px;color:var(--tx2);font-weight:400">— 자동</span></div><div id="dxbox"></div></div>
    <div class="sec"><div class="sec-h">💬 ④ 평가 · 중재 <span style="font-size:12px;color:var(--tx2);font-weight:400">— 📢 말하고 탭하면 기록</span></div><div id="ivlist"></div></div>
  </div>
</main>
<div class="sheet">
  <div class="sh-h">📋 <b>간호기록 미리보기</b> <span class="c" id="cnt">0줄</span><button onclick="copyNote()">📤 복사</button></div>
  <div class="sh-b" id="preview"><div class="empty">유형을 선택하세요.</div></div>
</div>
<script>
const PUPIL={q:'동공 크기 확인 (Rt/Lt)', nt:'동공 변화 감별', kind:'value2', base:'동공크기 :', subs:[{key:'rt',label:'Rt',ph:'예: 3mm'},{key:'lt',label:'Lt',ph:'예: 3mm'}]};
const LIGHT={q:'빛 반사 확인', nt:'prompt/sluggish/hippus', kind:'pick3', base:'빛 반사 확인결과 @ 함', opts:['prompt','sluggish','hippus']};
const OBEY={q:'"제가 말하는 대로 한번 해보시겠어요?" — 명령 수행', kind:'toggle', opts:[{l:'가능',rec:'Obey command 가능함'},{l:'불가',rec:'Obey command 가능하지 않음',pos:true}]};
const ORIENT={q:'"오늘 날짜나 여기가 어딘지 아세요?" — 지남력', kind:'toggle', opts:[{l:'있음',rec:'사람에 대한 지남력 있음'},{l:'없음',rec:'사람에 대한 지남력 없음',pos:true}]};
const TYPES=[
  {key:'중독·음독', dx:'중독위험', ae:[
    {q:'"약물이나 다른 것을 삼키거나 드셨나요?"', kind:'check', rec:'음독 함'},
    {q:'"속이 메스껍거나 토하셨어요?"', kind:'toggle', opts:[{l:'있음',rec:'오심, 구토 있음',pos:true},{l:'없음',rec:'오심, 구토 없음'}]},
    PUPIL, OBEY, ORIENT],
    pe:[{say:'"위세척에 대해 설명드릴게요"', rec:'위세척에 대해 설명함'},{say:'"처방받은 해독제를 투여하겠습니다"', rec:'처방에 의해 해독제를 투여함'},{say:'"안전하게 곁에서 지켜드릴게요"', rec:'안전간호를 제공함'},{say:'"신경학적 증상을 확인하겠습니다"', rec:'신경학적 증상이 있는지 확인함'}]},
];
let state={type:null, ae:{}, pe:{}, grade:{LLE:null,LUE:null,RLE:null,RUE:null}};
const LIMBS=[['LLE','좌하지'],['LUE','좌상지'],['RLE','우하지'],['RUE','우상지']];
const GRADES=['0','I','II','III','IV','V'];
const ge=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const T=()=>TYPES.find(t=>t.key===state.type);
function renderTypes(){ ge('types').innerHTML=TYPES.map(t=>`<div class="tp ${state.type===t.key?'on':''}" data-tp="${t.key}">${t.key}</div>`).join(''); }
function renderAssess(){
  const t=T();
  ge('assess').innerHTML=t.ae.map((it,i)=>{
    const head=`<div class="qp">${esc(it.q)}${it.nt?`<span class="nt">· ${esc(it.nt)}</span>`:''}</div>`;
    if(it.kind==='value2'){const val=(typeof state.ae[i]==='object'&&state.ae[i])?state.ae[i]:{}; return `<div class="q">${head}<div style="display:flex;gap:10px">${it.subs.map(s=>`<div style="flex:1;display:flex;gap:6px;align-items:center"><span style="font-size:12px;color:var(--tx2)">${s.label}</span><input class="vin" data-a="${i}" data-k="value2" data-sub="${s.key}" placeholder="${esc(s.ph)}" value="${esc(val[s.key]||'')}"></div>`).join('')}</div></div>`;}
    if(it.kind==='pick3'){return `<div class="q">${head}<div class="opts">${it.opts.map(o=>`<div class="opt ${state.ae[i]===o?'pos':''}" data-a="${i}" data-k="pick3" data-v="${o}">${o}</div>`).join('')}</div></div>`;}
    if(it.kind==='check'){const on=state.ae[i]===true; return `<div class="q">${head}<div class="opts"><div class="opt ${on?'pos':''}" data-a="${i}" data-k="check" style="flex:0 0 auto;min-width:200px">${on?'✓ ':''}${esc(it.rec)}</div></div></div>`;}
    return `<div class="q">${head}<div class="opts">${it.opts.map((o,oi)=>{const sel=state.ae[i]===oi,cls=sel?(o.pos?'pos':'neg'):'';return `<div class="opt ${cls}" data-a="${i}" data-k="toggle" data-oi="${oi}">${esc(o.l)}</div>`;}).join('')}</div></div>`;
  }).join('');
  ge('dxbox').innerHTML=`<div class="dx"><b>${esc(t.dx)}</b><span class="auto">자동</span></div>`;
  ge('ivlist').innerHTML=t.pe.map((p,i)=>{
    let h=`<div class="iv ${state.pe[i]?'on':''}" data-iv="${i}"><div class="s"><span class="spk">📢</span>${esc(p.say)}</div><div class="r">→ ${esc(p.rec)} ${state.pe[i]?'✓ 기록됨':''}</div></div>`;
    if(p.grade && state.pe[i]){ h+=`<div style="border-left:3px solid var(--pe);padding-left:11px;margin:-2px 0 12px"><div style="font-size:12px;color:var(--pe);font-weight:700;margin:6px 0 7px">↳ 사지근력 등급 (비고) — 0~V</div>${LIMBS.map(([k,kr])=>`<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px"><span style="font-size:12px;color:var(--tx2);min-width:70px">${k} (${kr})</span><div class="opts" style="flex:1">${GRADES.map(g=>`<div class="opt ${state.grade[k]===g?'pos':''}" data-grade="${k}" data-g="${g}" style="min-width:32px;padding:7px 0;${state.grade[k]===g?'background:var(--pe);border-color:var(--pe);color:#1a1a1a':''}">${g}</div>`).join('')}</div></div>`).join('')}</div>`; }
    return h;
  }).join('');
}
function render(){
  if(!state.type){ ge('preview').innerHTML='<div class="empty">유형을 선택하세요.</div>'; ge('cnt').textContent='0줄'; return; }
  const t=T(); const L=[{c:'head',t:`[중독·음독 · ${state.type}]`}];
  t.ae.forEach((it,i)=>{const v=state.ae[i];
    if(it.kind==='check'&&v===true) L.push({c:'ae',tg:'A&E',t:it.rec});
    if(it.kind==='toggle'&&v!=null) L.push({c:'ae',tg:'A&E',t:it.opts[v].rec});
    if(it.kind==='pick3'&&v) L.push({c:'ae',tg:'A&E',t:it.base.replace('@',v)});
    if(it.kind==='value2'&&v&&typeof v==='object'){const ps=[];if(v.rt&&v.rt.trim())ps.push('Rt '+v.rt.trim());if(v.lt&&v.lt.trim())ps.push('Lt '+v.lt.trim());if(ps.length)L.push({c:'ae',tg:'A&E',t:it.base+' '+ps.join(' / ')});}
  });
  L.push({c:'d',tg:'D',t:t.dx});
  t.pe.forEach((p,i)=>{if(state.pe[i]){L.push({c:'pe',tg:'P&E',t:p.rec}); if(p.grade){const g=[];LIMBS.forEach(([k])=>{if(state.grade[k])g.push(k+' '+state.grade[k]);}); if(g.length)L.push({c:'note',tg:'📌',t:'비고: 사지근력 '+g.join(' / ')});}}});
  const rec=L.filter(x=>x.c!=='head'); ge('cnt').textContent=rec.length+'줄';
  ge('preview').innerHTML=L.map(x=>x.c==='head'?`<div class="rl head">${esc(x.t)}</div>`:`<div class="rl ${x.c}"><span class="tg">${x.tg}</span>${esc(x.t)}</div>`).join('');
}
ge('types').addEventListener('click',e=>{const el=e.target.closest('[data-tp]');if(!el)return;state={type:el.dataset.tp,ae:{},pe:{},grade:{LLE:null,LUE:null,RLE:null,RUE:null}};renderTypes();ge('body').classList.remove('hide');renderAssess();render();});
ge('assess').addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.dataset.k==='value2')return;const i=+el.dataset.a;
  if(el.dataset.k==='check') state.ae[i]=state.ae[i]===true?undefined:true;
  else if(el.dataset.k==='pick3'){const v=el.dataset.v; state.ae[i]=state.ae[i]===v?undefined:v;}
  else {const oi=+el.dataset.oi; state.ae[i]=state.ae[i]===oi?undefined:oi;}
  renderAssess();render();});
ge('assess').addEventListener('input',e=>{const el=e.target.closest('[data-k="value2"]');if(!el)return;const i=+el.dataset.a;if(typeof state.ae[i]!=='object'||state.ae[i]==null)state.ae[i]={};state.ae[i][el.dataset.sub]=el.value;render();});
ge('ivlist').addEventListener('click',e=>{const gr=e.target.closest('[data-grade]');if(gr){const k=gr.dataset.grade;state.grade[k]=state.grade[k]===gr.dataset.g?null:gr.dataset.g;renderAssess();render();return;}const el=e.target.closest('[data-iv]');if(!el)return;const i=+el.dataset.iv;state.pe[i]=!state.pe[i];renderAssess();render();});
function copyNote(){alert('복사 데모');}
renderTypes();
</script>
</body>
</html>
